# The test execution profile.
#
# Two failure modes that `cargo test` cannot handle:
#
# 1. **A hanging test.** A driver waiting for an answer that will never come
#    does not fail: it waits. Locally we interrupt it; in CI it consumes the
#    runner up to the job timeout, and the report does not name the culprit.
#    `slow-timeout` with `terminate-after` kills it and names it.
#
# 2. **Tests stepping on each other.** The PostgreSQL integration tests create
#    and drop objects in the `public` schema of the same server. Their module
#    requires `--test-threads=1` in a comment — that is, it requires it of
#    whoever thinks of reading it. A group makes it true without anyone having
#    to think of it.
#
# nextest does NOT run documentation tests: `make test` also runs
# `cargo test --doc`. Without it, the `//!` examples would silently stop being
# compiled.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }

[test-groups]
# One test at a time on the shared test server.
serveur-partage = { max-threads = 1 }

# The timeout is raised for this package: two of its tests prove server-side
# cancellation and streaming over a volume that does not fit in memory. They
# are slow by construction, and 60 s would kill them while they do their job.
[[profile.default.overrides]]
filter = 'package(oxyn-driver-postgres)'
test-group = 'serveur-partage'
slow-timeout = { period = "300s", terminate-after = 1 }

# The MySQL integration tests create and drop objects in one disposable
# database. Keeping them in the same group also prevents them racing the
# PostgreSQL and desktop suites that use the CI services.
[[profile.default.overrides]]
filter = 'package(oxyn-driver-mysql)'
test-group = 'serveur-partage'
slow-timeout = { period = "300s", terminate-after = 1 }

# The ClickHouse integration tests count the statements `system.processes`
# shows, and create and drop the same databases: one at a time.
[[profile.default.overrides]]
filter = 'package(oxyn-driver-clickhouse)'
test-group = 'serveur-partage'
slow-timeout = { period = "300s", terminate-after = 1 }

# The Redis integration tests flush and fill database 9 of one server, and
# two of them prove a server-side stop and a streamed hash of a million fields.
[[profile.default.overrides]]
filter = 'package(oxyn-driver-redis)'
test-group = 'serveur-partage'
slow-timeout = { period = "300s", terminate-after = 1 }

# Production reads exercised through the bus create a schema and a role of the
# same name on the same test server.
[[profile.default.overrides]]
filter = 'package(oxyn-exec) & test(/production_read_tests::server::/)'
test-group = 'serveur-partage'

# This suite observes a real server-side cancellation through the desktop
# backend. It shares the PostgreSQL service with the driver tests.
[[profile.default.overrides]]
filter = 'package(oxyn-desktop) & test(/server_cancel::/)'
test-group = 'serveur-partage'
