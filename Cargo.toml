[workspace]
resolver = "3"
members = ["crates/*", "drivers/*"]

[workspace.package]
version       = "0.0.6"
edition       = "2024"
# 1.95 and not 1.94: `sqlx 0.9.0` requires 1.94.0, but `wasmtime 48.0.5`
# requires 1.95.0. wasmtime is behind oxyn-plugin's `wasm-host` feature, off by
# default — cargo therefore does not check its rust-version in an ordinary
# build, and the real floor would stay invisible until the day someone enables
# the feature. See ADR-0008 and RESEARCH-NOTES.
rust-version  = "1.95"
# The application is under GPL; the four crates a third-party driver must link
# write `Apache-2.0` in their own manifest (ADR-0044, NOTICE).
license       = "GPL-3.0-or-later"
# Every GPL crate inherits `publish = false`. That is what exempts it from the
# license check of `cargo deny` (`[licenses.private]` in deny.toml) without
# adding the GPL to the `allow` list, where it would also accept a third-party
# dependency. The Apache crates do not inherit it: they stay publishable.
publish       = false
repository    = "https://github.com/so-keyldzn/oxyn"
authors       = ["Oxyn contributors"]

# ─────────────────────────────────────────────────────────────────────────────
# Every version is resolved and pinned here. Crates never write a version
# number: they use `dep.workspace = true`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# --- internal crates ---------------------------------------------------------
oxyn-core     = { path = "crates/oxyn-core" }
oxyn-catalog  = { path = "crates/oxyn-catalog" }
oxyn-data     = { path = "crates/oxyn-data" }
oxyn-driver   = { path = "crates/oxyn-driver" }
oxyn-query    = { path = "crates/oxyn-query" }
oxyn-exec     = { path = "crates/oxyn-exec" }
oxyn-store    = { path = "crates/oxyn-store" }
oxyn-secrets  = { path = "crates/oxyn-secrets" }
oxyn-llm      = { path = "crates/oxyn-llm" }
oxyn-ai       = { path = "crates/oxyn-ai" }
oxyn-plugin   = { path = "crates/oxyn-plugin" }
oxyn-driver-sqlite   = { path = "drivers/oxyn-driver-sqlite" }
oxyn-driver-postgres = { path = "drivers/oxyn-driver-postgres" }
oxyn-driver-mysql    = { path = "drivers/oxyn-driver-mysql" }

# --- foundation --------------------------------------------------------------
anyhow        = "1.0.104"
async-trait   = "0.1.92"
bitflags      = { version = "2.13.1", features = ["serde"] }
bytes         = "1.12.1"
chrono        = { version = "0.4.45", features = ["serde"] }
async-process = "2.5.0"
# MCP server on the loopback (ADR-0030). Already in the tree through `reqwest`
# and `tauri`: declaring them brings no new family in.
hyper         = { version = "1.11.1", features = ["server", "http1"] }
hyper-util    = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
# Aligned on the version `agent-client-protocol` already pulls: a second copy
# of a system-call crate in the tree would bring nothing. `fs` opens a user's
# agent file without following a link nor waiting on a FIFO (ADR-0049 § 4).
rustix        = { version = "0.38.44", features = ["process", "fs"] }
futures       = "0.3.34"
indexmap      = { version = "2.14.2", features = ["serde"] }
parking_lot   = "0.12.5"
serde         = { version = "1.0.229", features = ["derive", "rc"] }
serde_json    = "1.0.151"
smallvec      = { version = "1.16.0", features = ["union", "serde"] }
thiserror     = "2.0.20"
tokio         = { version = "1.53.1", features = ["sync", "time", "macros"] }
tracing       = "0.1.44"
url           = { version = "2.5.8", features = ["serde"] }
uuid          = { version = "1.26.0", features = ["v4", "v7", "serde"] }

# --- data --------------------------------------------------------------------
arrow         = { version = "59.3.0", features = ["chrono-tz"] }
tempfile      = "3.27.0"

# --- queries -----------------------------------------------------------------
sqlparser     = "0.62.0"

# --- storage & secrets -------------------------------------------------------
directories   = "6.0.0"
keyring       = "4.2.0"
# rusqlite is pinned to 0.37 ON PURPOSE: sqlx pulls `sqlx-sqlite` into the
# resolution graph (even when disabled by feature), and both declare
# `links = "sqlite3"`. Only one version of libsqlite3-sys can therefore exist.
# sqlx 0.9 accepts >=0.30.1,<0.38; rusqlite 0.37 requires ^0.35 — that is the
# intersection. Raise it when sqlx follows.
#
# `column_decltype` exposes `Statement::columns()` and `Column::decl_type()`.
# SQLite has no column type: the type declared in CREATE TABLE is the only hint
# available before reading a row, and the driver uses it to propose an Arrow
# schema it then corrects on probing. Without this feature, the method simply
# does not exist — the error is an E0599 on `columns`, which never names the
# missing feature.
rusqlite      = { version = "0.37.0", features = [
    "bundled", "chrono", "serde_json", "column_decltype" ] }
# The sqlite-vec extension, compiled from its C amalgamation with `SQLITE_CORE`:
# it calls the SQLite that `rusqlite`'s `bundled` links, there is no second
# engine. The SQLite driver registers it on each connection it opens
# (ADR-0054). Pinned EXACTLY: the driver's `unsafe` relies on the C signature
# of `sqlite3_vec_init` and on `SQLITE_CORE` in its `build.rs`, so a bump
# re-reads both (`vector_extension.rs`) instead of arriving with `cargo update`.
sqlite-vec    = "=0.1.9"
secrecy      = { version = "0.10.3", features = ["serde"] }
zeroize       = "1.9.0"

# --- drivers -----------------------------------------------------------------
# aws-lc-rs and not ring: reqwest 0.13 imposes aws-lc-rs through its `rustls`
# feature. Unifying avoids compiling and shipping two crypto providers.
sqlx          = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "json",
] }
# MySQL and MariaDB (ADR-0050): `sqlx-mysql` fails a whole result on a `VECTOR`
# column and drops a `DECIMAL`'s scale. `default-rustls` is `rustls` on
# aws-lc-rs, the provider above; `client_ed25519` and `client_parsec` are
# MariaDB's authentication plugins. Exact version: the driver guards against
# library behaviors observed on this release (RESEARCH-NOTES, 2026-09-30).
mysql_async   = { version = "=0.37.1", default-features = false, features = [
    "default-rustls", "client_ed25519", "client_parsec",
] }
# The release `mysql_async` resolves to, named so that the driver can ask its
# named-parameter parser whether a text would be rewritten before it is
# prepared (ADR-0050). Exact: the guard is only right for this parser.
mysql_common  = { version = "=0.37.3", default-features = false }

# --- AI ----------------------------------------------------------------------
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls`.
reqwest       = { version = "0.13.4", default-features = false, features = [
    "json", "stream", "rustls", "http2", "charset",
] }
schemars      = "1.2.2"
# The external agents protocol (ADR-0026). Apache-2.0, hence compatible with
# Oxyn's GPL (ADR-0044). The crate's number does **not** give the protocol's:
# 2.1.0 carries a stable v1 and a draft v2.
# Checked on 2026-09-14, see RESEARCH-NOTES.
agent-client-protocol = "2.1.0"
# The front matter of agent files (ADR-0049). `deserialize` only: Oxyn never
# writes YAML, and `include` stays off — an agent file has no business reading
# another file. Checked on 2026-09-29, see RESEARCH-NOTES.
serde-saphyr  = { version = "1.3.0", default-features = false, features = ["deserialize"] }

# --- plugins (optional, `wasm-host` feature) ---------------------------------
wasmtime      = "48.0.5"
toml          = "0.9.8"

# --- UI ----------------------------------------------------------------------
# Tauri is a dependency of oxyn-desktop only: the isolation rule of ADR-0001,
# carried over by ADR-0029. Versions read on crates.io on 2026-10-02, see
# RESEARCH-NOTES: 2.12 is the floor of the updater and opener plugins below.
tauri               = "2.12.1"
tauri-build         = "2.7.1"
tauri-plugin-dialog = "2.7.3"
# Automatic updates (ADR-0051), driven from Rust only: no TLS feature of its
# own. `rustls-tls` would bring `ring` and install it as the process's default
# provider; the `reqwest` it shares with `oxyn-llm` already has `rustls` on
# aws-lc-rs, the provider of the drivers. `zip` is only for Windows and
# gzipped AppImages: the macOS archive's `tar` and `flate2` are unconditional.
tauri-plugin-updater = { version = "2.13.1", default-features = false }
# The release page in the system browser, called from Rust: the webview is
# granted none of its commands.
tauri-plugin-opener = "2.7.0"
# The startup failure dialog, shown before the Tauri application exists. Same
# version as the one `tauri-plugin-dialog` pulls (Cargo.lock): a single `rfd`
# in the graph. See RESEARCH-NOTES.
rfd                 = { version = "0.16.0", default-features = false }

# --- observability & binary --------------------------------------------------
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# --- dev ---------------------------------------------------------------------
# `criterion` is never a normal dependency: it only enters the graph through
# the `[[bench]]`s (RESEARCH-NOTES § benchmarks).
criterion     = "0.8.2"
insta         = "1.48.0"
rstest        = "0.26.1"

[workspace.lints.rust]
unsafe_code               = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms          = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
dbg_macro     = "warn"
todo          = "allow"
unwrap_used   = "warn"
expect_used   = "allow"
# Explicit `deny`, not inherited from `all`: the `clippy.toml` list carries the
# invariants reduced to a call path. Letting it depend on the grouping of `all`
# would mean a category change in clippy could disarm a wall without anything
# reporting it.
disallowed_methods = "deny"
disallowed_types   = "deny"

[profile.dev]
opt-level = 1              # opt-level 0 makes the application too slow to use

[profile.dev.package."*"]
opt-level = 2              # dependencies always optimized

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true
