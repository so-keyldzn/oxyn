[workspace]
resolver = "3"
members = ["crates/*", "drivers/*"]

[workspace.package]
version       = "0.0.1"
edition       = "2024"
# 1.95 et non 1.94 : `sqlx 0.9.0` exige 1.94.0, mais `wasmtime 48.0.1` exige
# 1.95.0. wasmtime est derrière la fonctionnalité `wasm-host` d'oxyn-plugin,
# désactivée par défaut — cargo ne vérifie donc pas son rust-version dans une
# construction ordinaire, et le plancher réel resterait invisible jusqu'au jour
# où quelqu'un active la fonctionnalité. Voir ADR-0008 et RESEARCH-NOTES.
rust-version  = "1.95"
license       = "Apache-2.0"
repository    = "https://github.com/keyldzn/oxyn"
authors       = ["Oxyn contributors"]

# ─────────────────────────────────────────────────────────────────────────────
# Toutes les versions sont résolues et figées ici. Les crates n'écrivent jamais
# un numéro de version : elles utilisent `dep.workspace = true`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# --- crates internes ---------------------------------------------------------
oxyn-core     = { path = "crates/oxyn-core" }
oxyn-catalog  = { path = "crates/oxyn-catalog" }
oxyn-data     = { path = "crates/oxyn-data" }
oxyn-driver   = { path = "crates/oxyn-driver" }
oxyn-query    = { path = "crates/oxyn-query" }
oxyn-exec     = { path = "crates/oxyn-exec" }
oxyn-store    = { path = "crates/oxyn-store" }
oxyn-secrets  = { path = "crates/oxyn-secrets" }
oxyn-llm      = { path = "crates/oxyn-llm" }
oxyn-ai       = { path = "crates/oxyn-ai" }
oxyn-plugin   = { path = "crates/oxyn-plugin" }
oxyn-driver-sqlite   = { path = "drivers/oxyn-driver-sqlite" }
oxyn-driver-postgres = { path = "drivers/oxyn-driver-postgres" }

# --- socle -------------------------------------------------------------------
anyhow        = "1.0.104"
async-trait   = "0.1.92"
bitflags      = { version = "2.13.1", features = ["serde"] }
bytes         = "1.12.1"
chrono        = { version = "0.4.45", features = ["serde"] }
async-process = "2.5.0"
# Serveur MCP sur la boucle locale (ADR-0030). Déjà dans l'arbre par `reqwest`
# et `tauri` : les déclarer n'y fait entrer aucune famille nouvelle.
hyper         = { version = "1.11.1", features = ["server", "http1"] }
hyper-util    = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
# Alignée sur la version que tire déjà `agent-client-protocol` : une seconde
# copie d'une crate d'appels système dans l'arbre n'apporterait rien.
rustix        = { version = "0.38.44", features = ["process"] }
futures       = "0.3.34"
indexmap      = { version = "2.14.2", features = ["serde"] }
parking_lot   = "0.12.5"
serde         = { version = "1.0.229", features = ["derive", "rc"] }
serde_json    = "1.0.151"
smallvec      = { version = "1.16.0", features = ["union", "serde"] }
thiserror     = "2.0.20"
tokio         = { version = "1.53.1", features = ["sync", "time", "macros"] }
tracing       = "0.1.44"
url           = { version = "2.5.8", features = ["serde"] }
uuid          = { version = "1.26.0", features = ["v4", "v7", "serde"] }

# --- données -----------------------------------------------------------------
arrow         = { version = "59.3.0", features = ["chrono-tz"] }
tempfile      = "3.27.0"

# --- requêtes ----------------------------------------------------------------
sqlparser     = "0.62.0"

# --- stockage & secrets ------------------------------------------------------
directories   = "6.0.0"
keyring       = "4.2.0"
# rusqlite est épinglé en 0.37 A DESSEIN : sqlx tire `sqlx-sqlite` dans le graphe de
# résolution (même désactivé par feature), et les deux déclarent `links = "sqlite3"`.
# Une seule version de libsqlite3-sys peut donc exister. sqlx 0.9 accepte >=0.30.1,<0.38 ;
# rusqlite 0.37 demande ^0.35 — c'est l'intersection. À relever quand sqlx suivra.
#
# `column_decltype` expose `Statement::columns()` et `Column::decl_type()`. SQLite
# n'a pas de type de colonne : le type déclaré au CREATE TABLE est la seule
# indication disponible avant d'avoir lu une ligne, et le driver s'en sert pour
# proposer un schéma Arrow qu'il corrige ensuite à la sonde. Sans cette
# fonctionnalité, la méthode n'existe simplement pas — l'erreur est un E0599 sur
# `columns`, qui ne nomme jamais la feature manquante.
rusqlite      = { version = "0.37.0", features = [
    "bundled", "chrono", "serde_json", "column_decltype" ] }
secrecy       = { version = "0.10.3", features = ["serde"] }
zeroize       = "1.9.0"

# --- drivers -----------------------------------------------------------------
# aws-lc-rs et non ring : reqwest 0.13 impose aws-lc-rs via sa feature `rustls`.
# Unifier évite de compiler et d'embarquer deux fournisseurs cryptographiques.
sqlx          = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "json",
] }

# --- IA ----------------------------------------------------------------------
# reqwest 0.13 a renommé la feature `rustls-tls` en `rustls`.
reqwest       = { version = "0.13.4", default-features = false, features = [
    "json", "stream", "rustls", "http2", "charset",
] }
schemars      = "1.2.2"
# Le protocole des agents externes (ADR-0026). Apache-2.0, donc compatible avec
# la licence du dépôt — contrairement au source de Zed, qui est GPL-3.0-or-later
# et qu'il ne faut donc pas recopier ici. Le numéro de la crate ne dit **pas**
# celui du protocole : la 2.1.0 porte un v1 stable et un v2 brouillon.
# Vérifié le 2026-09-14, voir RESEARCH-NOTES.
agent-client-protocol = "2.1.0"

# --- plugins (optionnel, feature `wasm-host`) --------------------------------
wasmtime      = "48.0.1"
toml          = "0.9.8"

# --- UI ----------------------------------------------------------------------
# Tauri n'est une dépendance que d'oxyn-desktop : la règle d'isolation de
# l'ADR-0001, transposée par l'ADR-0029. Versions relevées sur crates.io le
# 2026-09-15, voir RESEARCH-NOTES.
tauri               = "2.11.5"
tauri-build         = "2.6.3"
tauri-plugin-dialog = "2.7.3"
# Le dialogue d'échec de démarrage, affiché avant que l'application Tauri n'existe.
# Même version que celle que tire `tauri-plugin-dialog` (Cargo.lock) : une seule
# `rfd` dans le graphe. Voir RESEARCH-NOTES.
rfd                 = { version = "0.16.0", default-features = false }

# --- observabilité & binaire -------------------------------------------------
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# --- dev ---------------------------------------------------------------------
# `criterion` n'est jamais une dépendance normale : il n'entre dans le graphe que
# par les `[[bench]]` (RESEARCH-NOTES § bancs d'essai).
criterion     = "0.8.2"
insta         = "1.48.0"
rstest        = "0.26.1"

[workspace.lints.rust]
unsafe_code               = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms          = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
dbg_macro     = "warn"
todo          = "allow"
unwrap_used   = "warn"
expect_used   = "allow"
# `deny` explicite, et non hérité de `all` : c'est la liste de `clippy.toml` qui
# porte les invariants ramenés à un chemin d'appel. La laisser dépendre du
# regroupement de `all` reviendrait à ce qu'un changement de catégorie chez
# clippy désarme un mur sans que rien ne le signale.
disallowed_methods = "deny"
disallowed_types   = "deny"

[profile.dev]
opt-level = 1              # opt-level 0 rend l'application trop lente pour s'en servir

[profile.dev.package."*"]
opt-level = 2              # dépendances toujours optimisées

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true
