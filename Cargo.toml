[workspace]
resolver = "3"
members = ["crates/*", "drivers/*"]

[workspace.package]
version       = "0.0.1"
edition       = "2024"
# 1.95 et non 1.94 : `sqlx 0.9.0` exige 1.94.0, mais `wasmtime 48.0.1` exige
# 1.95.0. wasmtime est derrière la fonctionnalité `wasm-host` d'oxyn-plugin,
# désactivée par défaut — cargo ne vérifie donc pas son rust-version dans une
# construction ordinaire, et le plancher réel resterait invisible jusqu'au jour
# où quelqu'un active la fonctionnalité. Voir ADR-0008 et RESEARCH-NOTES.
rust-version  = "1.95"
license       = "Apache-2.0"
repository    = "https://github.com/keyldzn/oxyn"
authors       = ["Oxyn contributors"]

# ─────────────────────────────────────────────────────────────────────────────
# Toutes les versions sont résolues et figées ici. Les crates n'écrivent jamais
# un numéro de version : elles utilisent `dep.workspace = true`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# --- crates internes ---------------------------------------------------------
oxyn-core     = { path = "crates/oxyn-core" }
oxyn-catalog  = { path = "crates/oxyn-catalog" }
oxyn-data     = { path = "crates/oxyn-data" }
oxyn-driver   = { path = "crates/oxyn-driver" }
oxyn-query    = { path = "crates/oxyn-query" }
oxyn-exec     = { path = "crates/oxyn-exec" }
oxyn-store    = { path = "crates/oxyn-store" }
oxyn-secrets  = { path = "crates/oxyn-secrets" }
oxyn-llm      = { path = "crates/oxyn-llm" }
oxyn-ai       = { path = "crates/oxyn-ai" }
oxyn-plugin   = { path = "crates/oxyn-plugin" }
oxyn-ui       = { path = "crates/oxyn-ui" }
oxyn-driver-sqlite   = { path = "drivers/oxyn-driver-sqlite" }
oxyn-driver-postgres = { path = "drivers/oxyn-driver-postgres" }

# --- socle -------------------------------------------------------------------
anyhow        = "1.0.104"
async-trait   = "0.1.92"
bitflags      = { version = "2.13.1", features = ["serde"] }
bytes         = "1.12.1"
chrono        = { version = "0.4.45", features = ["serde"] }
futures       = "0.3.34"
indexmap      = { version = "2.14.2", features = ["serde"] }
parking_lot   = "0.12.5"
serde         = { version = "1.0.229", features = ["derive", "rc"] }
serde_json    = "1.0.151"
smallvec      = { version = "1.16.0", features = ["union", "serde"] }
thiserror     = "2.0.20"
tokio         = { version = "1.53.1", features = ["sync", "time", "macros"] }
tracing       = "0.1.44"
url           = { version = "2.5.8", features = ["serde"] }
uuid          = { version = "1.26.0", features = ["v4", "v7", "serde"] }

# --- données -----------------------------------------------------------------
arrow         = "59.3.0"
memmap2       = "0.9.11"
tempfile      = "3.27.0"

# --- requêtes ----------------------------------------------------------------
sqlparser     = "0.62.0"

# --- stockage & secrets ------------------------------------------------------
directories   = "6.0.0"
keyring       = "4.2.0"
# rusqlite est épinglé en 0.37 A DESSEIN : sqlx tire `sqlx-sqlite` dans le graphe de
# résolution (même désactivé par feature), et les deux déclarent `links = "sqlite3"`.
# Une seule version de libsqlite3-sys peut donc exister. sqlx 0.9 accepte >=0.30.1,<0.38 ;
# rusqlite 0.37 demande ^0.35 — c'est l'intersection. À relever quand sqlx suivra.
#
# `column_decltype` expose `Statement::columns()` et `Column::decl_type()`. SQLite
# n'a pas de type de colonne : le type déclaré au CREATE TABLE est la seule
# indication disponible avant d'avoir lu une ligne, et le driver s'en sert pour
# proposer un schéma Arrow qu'il corrige ensuite à la sonde. Sans cette
# fonctionnalité, la méthode n'existe simplement pas — l'erreur est un E0599 sur
# `columns`, qui ne nomme jamais la feature manquante.
rusqlite      = { version = "0.37.0", features = [
    "bundled", "chrono", "serde_json", "column_decltype" ] }
secrecy       = { version = "0.10.3", features = ["serde"] }
zeroize       = "1.9.0"

# --- drivers -----------------------------------------------------------------
# aws-lc-rs et non ring : reqwest 0.13 impose aws-lc-rs via sa feature `rustls`.
# Unifier évite de compiler et d'embarquer deux fournisseurs cryptographiques.
sqlx          = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "json",
] }

# --- IA ----------------------------------------------------------------------
# reqwest 0.13 a renommé la feature `rustls-tls` en `rustls`.
reqwest       = { version = "0.13.4", default-features = false, features = [
    "json", "stream", "rustls", "http2", "charset",
] }
schemars      = "1.2.2"

# --- plugins (optionnel, feature `wasm-host`) --------------------------------
wasmtime      = "48.0.1"
toml          = "0.9.8"

# --- UI ----------------------------------------------------------------------
gpui          = "0.2.2"

# --- observabilité & binaire -------------------------------------------------
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# --- dev ---------------------------------------------------------------------
insta         = "1.48.0"
rstest        = "0.26.1"

[workspace.lints.rust]
unsafe_code               = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms          = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all           = { level = "warn", priority = -1 }
dbg_macro     = "warn"
todo          = "allow"
unwrap_used   = "warn"
expect_used   = "allow"

[profile.dev]
opt-level = 1              # le rendu GPUI est injouable en opt-level 0

[profile.dev.package."*"]
opt-level = 2              # dépendances toujours optimisées

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true
