# What the dependency graph is allowed to contain.
#
# `docs/SECURITY.md` § Dependencies makes this check part of the quality gate.
# It covers two things no other step looks at: published security advisories
# (RUSTSEC) and licenses.
#
# Without `cargo-deny` installed, the `make deny` target fails when the `CI`
# variable is set ("cargo-deny is required in CI; dependency checks did NOT
# run.") and only prints an explicit warning on a local clone. CI installs the
# pinned binary, so a missing installation there must fail rather than turn the
# dependency check into a no-op; a local clone without the optional tool is
# not blocked.

[advisories]
# An advisory published on a dependency is an error: that is the point of the
# check. `unmaintained = "all"` makes every advisory in the resolved graph
# fail, including transitive crates. Each currently unavoidable one is then
# listed below with its reason: an unmaintained crate on an external boundary
# is "a risk to document, not to ignore" (SECURITY).
yanked = "deny"
unmaintained = "all"
# An "unsoundness" advisory is informational for `cargo-deny`, and its default
# is `workspace`: without this line, RUSTSEC-2024-0429 went through the gate
# without a word, while GitHub displayed it. `all` makes it visible, including
# on a transitive dependency — which is where it is.
unsound = "all"

# Every entry carries its reason: an advisory ignored without a written reason
# becomes a forgotten advisory. Reviewing it is the job of `/versions`.
ignore = [
    # RUSTSEC-2024-0429, "unsound", reviewed on 2026-10-20 (advisory text read
    # in the local advisory-db checkout, HEAD of 2026-10-08).
    #
    # The defect: `glib::VariantStrIter::{next, nth, last, next_back, nth_back}`
    # in `glib` >= 0.15.0, < 0.20.0. `impl_get` passes `&p`, a reference to a
    # null `*mut c_char`, to `g_variant_get_child`, a C function that writes
    # through it; the compiler may disregard that write, and `CStr::from_ptr`
    # then receives NULL: a NULL-dereference crash (`glib 0.18.5`,
    # `src/variant_iter.rs`: `&p` at line 126, `CStr::from_ptr` at line 129).
    #
    # The code IS shipped. `glib 0.18.5` is the only `glib` in `Cargo.lock`, and
    # it is compiled into the Linux packages: x86_64 and aarch64, deb, rpm and
    # AppImage (job `paquets` of `.github/workflows/livraison.yml`). The chain
    # is `tauri` → `muda`, `tao`, `wry` → `gtk 0.18` → `atk` → `glib 0.18`;
    # `gdk`, `gio`, `pango` and `webkit2gtk` pull it too. macOS does not
    # compile it: `cargo tree -i glib@0.18.5 -e normal,build` prints nothing
    # for the two apple-darwin targets. The fix is in `glib 0.20`, which
    # `gtk 0.18` refuses (`glib = "0.18"`): nothing to bump until Tauri moves
    # to another GTK.
    #
    # Why the entry stands: the five methods are unreachable.
    # `Variant::array_iter_str` (`src/variant.rs`, lines 843-855) is the only
    # function that builds a `VariantStrIter`, because `VariantStrIter::new` is
    # `pub(crate)` (`src/variant_iter.rs`, line 109); every other call site is
    # under `#[cfg(test)]` (`variant.rs:2191`, `variant_iter.rs:203`). On
    # 2026-10-20, none of the 634 external crates of the two Linux dependency
    # graphs (`-e normal,build`, x86_64 and aarch64) other than `glib` itself,
    # and nothing in `crates/`, `drivers/` or `apps/`, calls `array_iter_str`
    # or names `VariantStrIter`.
    #
    # Re-check at every bump of `tauri`, `gtk`, `wry`, `muda`, `tao` or
    # `webkit2gtk`: list the crates with
    #   cargo tree --offline -p oxyn-desktop --target <t> -e normal,build --prefix none
    # for <t> = x86_64-unknown-linux-gnu and aarch64-unknown-linux-gnu, then
    # grep their registry sources for `array_iter_str` and `VariantStrIter`.
    # Only `glib` itself may match. Drop this entry once the chain reaches
    # `glib` >= 0.20.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 via Tauri's gtk 0.18, compiled into the Linux packages; fixed in 0.20, which gtk 0.18 refuses; VariantStrIter unreachable: nothing calls Variant::array_iter_str (checked 2026-10-20)" },
    # `paste` is transitive through the local embeddings stack. `burn` 0.22
    # does not provide a release without it; the advisory has no safe upgrade.
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is transitive through burn 0.22 and tokenizers in oxyn-embed; the advisory offers no safe upgrade (checked 2026-10-22)" },
    # GTK 0.18 cannot move away from this macro crate without Tauri replacing
    # its GTK 3 stack; the advisory has no safe upgrade.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is transitive through gtk 0.18 and glib-macros from Tauri's Linux stack; the advisory offers no safe upgrade (checked 2026-10-22)" },
    # `zbus` 5 supplies both the keyring backend and a Tauri plugin. The
    # migration is a major-version move to zbus 6, which the current graph does
    # not accept.
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 is transitive through zbus 5 from keyring and Tauri plugins; its replacement is merged into zbus 6, a graph-wide major upgrade (checked 2026-10-22)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.0 is transitive through zbus 5 from keyring and Tauri plugins; its replacement is merged into zbus 6, a graph-wide major upgrade (checked 2026-10-22)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.0 is transitive through zvariant 5 from keyring and Tauri plugins; its replacement is merged into zbus 6, a graph-wide major upgrade (checked 2026-10-22)" },
]

[licenses]
# The permissive licenses this repository accepts without discussion. Any other
# needs an explicit decision: a dependency under strong copyleft changes the
# obligations of the whole product, and that is not something to discover at
# release time.
#
# The application is under GPL-3.0-or-later (ADR-0044): every license in this
# list must therefore be compatible with the GPLv3. The verdict comes from the
# FSF list, reread on 2026-09-25 (RESEARCH-NOTES § Licenses). It is written on
# each line so that an addition without a verdict shows in review.
#
# `script/licences-tierces` also reads this list: shipped npm dependencies obey
# the same rule.
allow = [
    "Apache-2.0",                     # FSF: compatible with the GPLv3, not with the GPLv2
    "Apache-2.0 WITH LLVM-exception", # the exception only adds permissions
    "MIT",                            # FSF, "Expat": compatible
    "MIT-0",                          # FSF, "Expat0": compatible
    "BSD-2-Clause",                   # FSF, "FreeBSD": compatible
    "BSD-3-Clause",                   # FSF, "Modified BSD": compatible
    "ISC",                            # FSF: compatible
    "Zlib",                           # FSF: compatible
    "Unicode-3.0",                    # FSF, "Unicode License v3": compatible with all versions
    "CC0-1.0",                        # FSF: compatible
    # FSF: compatible through section 3.3, except for a file marked
    # "Incompatible With Secondary Licenses". None of the MPL crates in the
    # graph carries that notice (read on 2026-09-25, RESEARCH-NOTES).
    "MPL-2.0",
    "BSL-1.0",                        # FSF, "Boost": compatible
    # `libfuzzer-sys`, under the University of Illinois license. Permissive,
    # OSI-approved, and GPL-compatible according to the FSF.
    "NCSA",
    # `webpki-root-certs` and `webpki-roots`: the list of certificate
    # authorities, published under a permissive **data** license. The FSF does
    # not classify it. Its only condition is to include its text with the shared
    # data (§ 2.1), which a notice the GPLv3 allows (§ 7 b) covers: the
    # application's third-party notices reproduce it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The GPL crates of the workspace declare `publish = false` (Cargo.toml):
# `cargo deny` does not judge their license. That is the mechanism intended for
# private crates, and it avoids adding `GPL-3.0-or-later` to `allow`, where it
# would also accept, without a decision, a third-party GPL dependency. The
# Apache crates, which are publishable, stay checked.
[licenses.private]
ignore = true

[bans]
# Two versions of the same crate in the graph are tolerated — the ecosystem
# forces some —, except where ADR-0010 explicitly forbids it.
multiple-versions = "allow"

# What this file does **not** check, and where it is checked: the uniqueness of
# `libsqlite3-sys` in the graph (ADR-0010). Two versions would make two native
# SQLite libraries, with two global states, live in the same process.
# `cargo-deny` can only express it with a **global**
# `multiple-versions = "deny"`, which would fail on the ecosystem's ordinary
# duplicates; and `[[bans.deny]]` would forbid the whole crate, which would
# break the SQLite driver.
#
# The constraint is therefore held elsewhere, and it is: by the workspace's
# version resolution (see the comment in `Cargo.toml` about `sqlx` and
# `rusqlite`) and by `oxyn-store` and the driver declaring the same one.

[sources]
# Nothing comes from anywhere but the public registry. An unpinned git
# dependency is an open door onto a third-party repository, and ADR-0009 ruled
# that path out for GPUI knowingly.
unknown-registry = "deny"
unknown-git = "deny"
