# Ce que le graphe de dépendances a le droit de contenir.
#
# `docs/SECURITY.md` § Dépendances fait de ce contrôle une partie de la porte de
# qualité. Il porte sur deux choses qu'aucune autre étape ne regarde : les avis
# de sécurité publiés (RUSTSEC) et les licences.
#
# La cible `make deny` avertit sans bloquer quand `cargo-deny` n'est pas
# installé. Une porte qui échoue sur un outil absent finit par être contournée,
# et c'est alors tout le contrôle qui disparaît.

[advisories]
# Un avis publié sur une dépendance est une erreur : c'est l'objet du contrôle.
# `unmaintained` avertit plutôt que de bloquer — une crate non maintenue sur une
# frontière externe est « un risque à documenter, pas à ignorer » (SECURITY),
# et la bloquer d'office ferait échouer la porte sur une décision qui demande un
# arbitrage humain.
yanked = "deny"
unmaintained = "workspace"
# Un avis d'« unsoundness » est informatif pour `cargo-deny`, et sa valeur par
# défaut est `none` : sans cette ligne, RUSTSEC-2024-0429 traversait la porte
# sans un mot, alors que GitHub l'affichait. `all` le fait voir, y compris sur
# une dépendance transitive — c'est là qu'il se trouve.
unsound = "all"

# Chaque entrée porte sa raison : un avis ignoré sans motif écrit devient un
# avis oublié. La revoir est le geste de `/versions`.
ignore = [
    # `glib::VariantStrIter` peut produire une référence pendante. La chaîne est
    # `tauri` → `gtk 0.18` → `atk` → `glib 0.18`, uniquement sur Linux : la
    # correction est dans `glib 0.20`, que `gtk 0.18` refuse. Rien à monter ici
    # tant que Tauri n'a pas changé de GTK, et rien de compilé sur macOS, la
    # seule cible livrée aujourd'hui. Oxyn n'appelle pas cet itérateur.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 via gtk 0.18 de Tauri ; corrigé en 0.20, que gtk 0.18 refuse ; code Linux, non compilé sur la cible livrée" },
]

[licenses]
# Les licences permissives que ce dépôt accepte sans discussion. Toute autre
# demande un arbitrage explicite : une dépendance sous copyleft fort change les
# obligations du produit entier, et cela ne se découvre pas à la publication.
#
# L'application est sous GPL-3.0-or-later (ADR-0044) : chaque licence de cette
# liste doit donc être compatible avec la GPLv3. Le verdict vient de la liste
# de la FSF, relue le 2026-09-25 (RESEARCH-NOTES § Licences). Il est écrit sur
# chaque ligne pour qu'un ajout sans verdict se voie en revue.
#
# `script/verifier-licences-npm` lit aussi cette liste : les dépendances npm
# livrées obéissent à la même règle.
allow = [
    "Apache-2.0",                     # FSF : compatible avec la GPLv3, pas avec la GPLv2
    "Apache-2.0 WITH LLVM-exception", # l'exception ne fait qu'ajouter des permissions
    "MIT",                            # FSF, « Expat » : compatible
    "MIT-0",                          # FSF, « Expat0 » : compatible
    "BSD-2-Clause",                   # FSF, « FreeBSD » : compatible
    "BSD-3-Clause",                   # FSF, « Modified BSD » : compatible
    "ISC",                            # FSF : compatible
    "Zlib",                           # FSF : compatible
    "Unicode-3.0",                    # FSF, « Unicode License v3 » : compatible avec toutes les versions
    "CC0-1.0",                        # FSF : compatible
    # FSF : compatible par la section 3.3, sauf pour un fichier marqué
    # « Incompatible With Secondary Licenses ». Aucune des crates sous MPL du
    # graphe ne porte cette mention (relevé le 2026-09-25, RESEARCH-NOTES).
    "MPL-2.0",
    "BSL-1.0",                        # FSF, « Boost » : compatible
    # `libfuzzer-sys`, sous la licence de l'université de l'Illinois. Permissive,
    # approuvée OSI, et compatible avec la GPL selon la FSF.
    "NCSA",
    # `webpki-root-certs` et `webpki-roots` : la liste des autorités de
    # certification, publiée sous une licence de **données** permissive. La FSF
    # ne la classe pas. Sa seule condition est de joindre son texte aux données
    # partagées (§ 2.1), ce qu'une mention que la GPLv3 autorise (§ 7 b) couvre :
    # les mentions tierces de l'application la reproduisent.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Les crates du workspace sous GPL déclarent `publish = false` (Cargo.toml) :
# `cargo deny` ne juge pas leur licence. C'est le mécanisme prévu pour les
# crates privées, et il épargne d'ajouter `GPL-3.0-or-later` à `allow`, où elle
# accepterait aussi, sans arbitrage, une dépendance tierce sous GPL. Les crates
# sous Apache, publiables, restent contrôlées.
[licenses.private]
ignore = true

[bans]
# Deux versions d'une même crate dans le graphe sont tolérées — l'écosystème en
# impose —, sauf là où ADR-0010 l'interdit explicitement.
multiple-versions = "allow"

# Ce que ce fichier **ne** vérifie **pas**, et où c'est vérifié :
# l'unicité de `libsqlite3-sys` dans le graphe (ADR-0010). Deux versions y
# feraient cohabiter deux bibliothèques SQLite natives, avec deux états globaux,
# dans le même processus. `cargo-deny` ne sait l'exprimer que par un
# `multiple-versions = "deny"` **global**, qui échouerait sur les doublons
# ordinaires de l'écosystème ; et `[[bans.deny]]` interdirait la crate entière,
# ce qui casserait le driver SQLite.
#
# La contrainte est donc tenue ailleurs, et elle l'est : par la résolution de
# versions du workspace (voir le commentaire de `Cargo.toml` sur `sqlx` et
# `rusqlite`) et par le fait qu'`oxyn-store` et le driver déclarent la même.

[sources]
# Rien ne vient d'ailleurs que du registre public. Une dépendance git non
# épinglée est une porte ouverte sur un dépôt tiers, et ADR-0009 a écarté cette
# voie pour GPUI en connaissance de cause.
unknown-registry = "deny"
unknown-git = "deny"
