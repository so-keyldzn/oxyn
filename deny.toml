# What the dependency graph is allowed to contain.
#
# `docs/SECURITY.md` § Dependencies makes this check part of the quality gate.
# It covers two things no other step looks at: published security advisories
# (RUSTSEC) and licenses.
#
# The `make deny` target warns without blocking when `cargo-deny` is not
# installed. A gate that fails on a missing tool ends up bypassed, and then the
# whole check disappears.

[advisories]
# An advisory published on a dependency is an error: that is the point of the
# check. `unmaintained` warns rather than blocks — an unmaintained crate on an
# external boundary is "a risk to document, not to ignore" (SECURITY), and
# blocking it outright would fail the gate on a decision that needs a human
# call.
yanked = "deny"
unmaintained = "workspace"
# An "unsoundness" advisory is informational for `cargo-deny`, and its default
# is `none`: without this line, RUSTSEC-2024-0429 went through the gate without
# a word, while GitHub displayed it. `all` makes it visible, including on a
# transitive dependency — which is where it is.
unsound = "all"

# Every entry carries its reason: an advisory ignored without a written reason
# becomes a forgotten advisory. Reviewing it is the job of `/versions`.
ignore = [
    # `glib::VariantStrIter` can produce a dangling reference. The chain is
    # `tauri` → `gtk 0.18` → `atk` → `glib 0.18`, on Linux only: the fix is in
    # `glib 0.20`, which `gtk 0.18` refuses. Nothing to bump here until Tauri
    # changes GTK, and nothing compiled on macOS, the only target shipped today.
    # Oxyn does not call this iterator.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 via Tauri's gtk 0.18; fixed in 0.20, which gtk 0.18 refuses; Linux code, not compiled for the shipped target" },
]

[licenses]
# The permissive licenses this repository accepts without discussion. Any other
# needs an explicit decision: a dependency under strong copyleft changes the
# obligations of the whole product, and that is not something to discover at
# release time.
#
# The application is under GPL-3.0-or-later (ADR-0044): every license in this
# list must therefore be compatible with the GPLv3. The verdict comes from the
# FSF list, reread on 2026-09-25 (RESEARCH-NOTES § Licenses). It is written on
# each line so that an addition without a verdict shows in review.
#
# `script/licences-tierces` also reads this list: shipped npm dependencies obey
# the same rule.
allow = [
    "Apache-2.0",                     # FSF: compatible with the GPLv3, not with the GPLv2
    "Apache-2.0 WITH LLVM-exception", # the exception only adds permissions
    "MIT",                            # FSF, "Expat": compatible
    "MIT-0",                          # FSF, "Expat0": compatible
    "BSD-2-Clause",                   # FSF, "FreeBSD": compatible
    "BSD-3-Clause",                   # FSF, "Modified BSD": compatible
    "ISC",                            # FSF: compatible
    "Zlib",                           # FSF: compatible
    "Unicode-3.0",                    # FSF, "Unicode License v3": compatible with all versions
    "CC0-1.0",                        # FSF: compatible
    # FSF: compatible through section 3.3, except for a file marked
    # "Incompatible With Secondary Licenses". None of the MPL crates in the
    # graph carries that notice (read on 2026-09-25, RESEARCH-NOTES).
    "MPL-2.0",
    "BSL-1.0",                        # FSF, "Boost": compatible
    # `libfuzzer-sys`, under the University of Illinois license. Permissive,
    # OSI-approved, and GPL-compatible according to the FSF.
    "NCSA",
    # `webpki-root-certs` and `webpki-roots`: the list of certificate
    # authorities, published under a permissive **data** license. The FSF does
    # not classify it. Its only condition is to include its text with the shared
    # data (§ 2.1), which a notice the GPLv3 allows (§ 7 b) covers: the
    # application's third-party notices reproduce it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The GPL crates of the workspace declare `publish = false` (Cargo.toml):
# `cargo deny` does not judge their license. That is the mechanism intended for
# private crates, and it avoids adding `GPL-3.0-or-later` to `allow`, where it
# would also accept, without a decision, a third-party GPL dependency. The
# Apache crates, which are publishable, stay checked.
[licenses.private]
ignore = true

[bans]
# Two versions of the same crate in the graph are tolerated — the ecosystem
# forces some —, except where ADR-0010 explicitly forbids it.
multiple-versions = "allow"

# What this file does **not** check, and where it is checked: the uniqueness of
# `libsqlite3-sys` in the graph (ADR-0010). Two versions would make two native
# SQLite libraries, with two global states, live in the same process.
# `cargo-deny` can only express it with a **global**
# `multiple-versions = "deny"`, which would fail on the ecosystem's ordinary
# duplicates; and `[[bans.deny]]` would forbid the whole crate, which would
# break the SQLite driver.
#
# The constraint is therefore held elsewhere, and it is: by the workspace's
# version resolution (see the comment in `Cargo.toml` about `sqlx` and
# `rusqlite`) and by `oxyn-store` and the driver declaring the same one.

[sources]
# Nothing comes from anywhere but the public registry. An unpinned git
# dependency is an open door onto a third-party repository, and ADR-0009 ruled
# that path out for GPUI knowingly.
unknown-registry = "deny"
unknown-git = "deny"
