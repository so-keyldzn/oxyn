# Les réglages de compilation qui doivent valoir pour tout le monde, y compris
# la CI. Ce fichier est le seul endroit où ils vivent : une variable
# d'environnement exportée dans un shell n'est vraie que pour celui qui l'a
# exportée, et la trace de plantage qu'un autre reçoit ne ressemble alors pas à
# la sienne.

[build]
# Le schéma v0 conserve les noms de types dans les symboles, y compris à travers
# les fermetures. Une trace GPUI sans lui est une suite de
# `{{closure}}::{{closure}}` : l'application est presque entièrement écrite en
# fermetures passées à `on_click`, `cx.spawn` et consorts, donc la trace ne
# désigne rien. C'est le mode de panne qu'on cherche à lire dans un rapport
# d'utilisateur, où l'on n'a rien d'autre.
rustflags = ["-C", "symbol-mangling-version=v0"]

[env]
# 13.0 comme `LSMinimumSystemVersion` dans `crates/oxyn-app/Oxyn.app.plist` :
# les deux valeurs disent la même chose et doivent bouger ensemble. Sans
# celle-ci, le binaire est lié pour la version de macOS de la machine qui
# construit — un paquet assemblé sur une machine récente refuse alors de
# démarrer sur une machine que le plist déclare pourtant supportée, avec un
# message système qui n'explique rien.
MACOSX_DEPLOYMENT_TARGET = "13.0"
