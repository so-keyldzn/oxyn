# Build settings that must hold for everyone, CI included. This file is the
# only place they live: an environment variable exported in a shell is only
# true for whoever exported it, and the crash trace someone else receives then
# does not look like theirs.

[build]
# The v0 scheme keeps type names in symbols, closures included. A trace without
# it is a string of `{{closure}}::{{closure}}`: the backend is written in
# futures and in closures passed to `spawn` and to Tauri commands, so the trace
# points at nothing. That is the failure mode we try to read in a user report,
# where we have nothing else.
rustflags = ["-C", "symbol-mangling-version=v0"]

[env]
# 13.0 like `bundle.macOS.minimumSystemVersion` in
# `crates/oxyn-desktop/tauri.conf.json`, which becomes `LSMinimumSystemVersion`:
# both values say the same thing and must move together. Without this one, the
# binary is linked for the macOS version of the build machine — a bundle built
# on a recent machine then refuses to start on a machine the plist declares
# supported, with a system message that explains nothing.
MACOSX_DEPLOYMENT_TARGET = "13.0"
