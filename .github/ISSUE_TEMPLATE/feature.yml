name: Proposal
description: Propose an improvement or a feature, with its product need.
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Need
      description: What user or operational problem does this proposal solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the expected behavior, including the error and cancellation states.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and invariants
      description: Name the authoritative documents, performance limits or security rules concerned.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which solutions did you consider, and why this proposal?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and documentation.
          required: true
        - label: I did not include any secret or sensitive data.
          required: true
