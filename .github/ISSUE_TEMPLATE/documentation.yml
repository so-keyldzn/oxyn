name: Documentation
description: Report a contradiction, a gap or outdated information.
title: "[Documentation] "
labels:
  - documentation
body:
  - type: input
    id: document
    attributes:
      label: Document concerned
      placeholder: docs/ARCHITECTURE.md
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Contradiction or gap
      description: Quote the current statement and the state observed in the code or on GitHub.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed correction
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the document and the files concerned on the main branch.
          required: true
