name: Bug
description: Report incorrect behavior or a reproducible regression.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please check that no open issue already describes the problem.
        Never put a secret, customer data or a private URL in this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and the expected behavior.
      placeholder: When ..., Oxyn ..., whereas ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the minimal steps and a reproducible synthetic example.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and redacted logs
      description: Add the useful tests, logs or screenshots, after removing secrets.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.0.1 or short SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rust backend
        - SQLite driver
        - PostgreSQL driver
        - Tauri interface
        - AI or provider
        - CI or delivery
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I did not include any secret or sensitive data.
          required: true
