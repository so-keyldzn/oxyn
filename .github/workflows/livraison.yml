# La livraison : un tag `v*` construit l'application en release et dépose ses
# paquets dans une release GitHub en BROUILLON.
#
# Rien n'est publié automatiquement : la release reste un brouillon jusqu'à ce
# qu'un humain la relise et la publie. Le tag doit porter la version de
# `crates/oxyn-desktop/tauri.conf.json` (`v0.0.1` pour `0.0.1`) : c'est elle
# que les paquets portent dans leur nom.
#
# Les paquets ne sont PAS signés : macOS demande au premier lancement un clic
# droit, puis « Ouvrir ». La signature et la notarisation demandent un compte
# Apple Developer et des secrets de dépôt qui n'existent pas encore.
#
# Versions des actions et des outils : docs/RESEARCH-NOTES.md, § CI et
# livraison GitHub.
name: livraison

on:
  push:
    tags: ["v*"]

# Deux poussées du même tag ne doivent pas écrire en même temps dans la même
# release.
concurrency:
  group: livraison-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  brouillon:
    runs-on: ubuntu-24.04
    steps:
      - name: Créer la release en brouillon
        # `--verify-tag` : la release ne s'attache qu'à un tag qui existe déjà
        # sur le dépôt, jamais à un tag que gh créerait lui-même.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --draft --verify-tag --generate-notes --title "Oxyn $GITHUB_REF_NAME"

  paquets:
    needs: brouillon
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Le target du workspace est à la racine, pas sous la crate.
            paquets: target/release/bundle/dmg/*.dmg
          - os: ubuntu-24.04
            paquets: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installer les bibliothèques système de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installer la chaîne d'outils épinglée
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restaurer le cache Cargo
        # Swatinem/rust-cache v2.9.2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Installer Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0, version lue dans `packageManager`
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Construire l'application en release
        # La même cible qu'en local : `make desktop PROFIL=release`.
        run: make desktop PROFIL=release

      - name: Déposer les paquets dans le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          PAQUETS: ${{ matrix.paquets }}
        run: |
          shopt -s nullglob
          fichiers=()
          while IFS= read -r motif; do
            [ -n "$motif" ] && fichiers+=($motif)
          done <<< "$PAQUETS"
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "Aucun paquet produit : le bundle de Tauri n'a rien écrit là où il était attendu."
            find . -path ./node_modules -prune -o -type d -name bundle -print
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${fichiers[@]}" --repo "$GITHUB_REPOSITORY" --clobber
