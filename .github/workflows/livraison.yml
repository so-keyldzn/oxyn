# Delivery: a `v*` tag builds the application in release mode and uploads its
# packages to a DRAFT GitHub release.
#
# Nothing is published automatically: the release stays a draft until a human
# reviews and publishes it. A published release receives nothing: a rerun, or a
# publication landing during the builds, fails the upload without touching its
# files. Only a publication during a file's upload can still receive that one
# file, and the job fails saying so. A file already present in the draft is
# never replaced.
#
# The tag is exactly `v` followed by the version of
# `crates/oxyn-desktop/tauri.conf.json`, prerelease suffix included
# (`v0.1.0-rc.1` for `0.1.0-rc.1`, which creates a draft marked as a
# prerelease); otherwise the workflow fails before creating the draft, and
# nothing is corrected automatically. That is the version the packages carry in
# their name.
#
# Both rules are applied and tested by `script/livraison`.
#
# macOS delivery requires Developer ID signing and Apple notarization; missing
# credentials fail closed. Setup and manual launch: docs/RELEASE.md.
#
# Automatic updates (ADR-0051): the macOS archive and the two AppImages
# (x86_64 and aarch64) are signed with the updater key in a job of their own,
# `signature`, which starts from a fresh checkout, runs neither `pnpm install`
# nor any build, and signs with a Tauri CLI release binary pinned by checksum.
# The build jobs never hold the key, and nothing they wrote — `node_modules`,
# the scripts, the runner's files — reaches the job that does: only their
# packages, as artifacts, which are signed, never run. The last job,
# `manifeste`, verifies each archive of the draft against its signature and the
# committed public key, then writes `latest.json`. A missing key, the
# placeholder public key, a missing archive or signature, or a signature that
# does not verify fail closed.
#
# The updater key lives in the `release` environment, which only `v*` tags
# may deploy to (docs/RELEASE.md, § Updater signing key): a workflow pushed on
# a branch cannot read it. The Apple credentials are repository secrets that
# the macOS build reads: an accepted risk, docs/SECURITY.md § The Apple
# release credentials.
#
# Each job gets the token permissions it uses and no more: only the three jobs
# that write the release — `brouillon`, `depot`, `manifeste` — get
# `contents: write`, and none of them holds a signing secret.
#
# Versions of the actions and tools: docs/RESEARCH-NOTES.md, § CI and GitHub
# delivery.
name: livraison

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.0.1)
        required: true
        type: string

# Two pushes of the same tag must not write to the same release at the same
# time.
concurrency:
  group: livraison-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Nothing by default: a job added later gets no token permission it does not
# ask for.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  brouillon:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # The job does not use git: `gh` gets its token through GH_TOKEN.
          persist-credentials: false

      # Also refuses the placeholder updater public key: the key itself is
      # only checked by the signing job, after the build.
      - name: Check the tag and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/livraison brouillon "$RELEASE_TAG" "$GITHUB_REPOSITORY"

  # Runs the untrusted part — `pnpm install`, every build.rs, proc-macro and
  # Vite plugin — without the updater key and without a token that can write.
  # Its only output is one artifact of unsigned packages per platform.
  paquets:
    needs: brouillon
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Names the artifact; the signing and upload jobs download it by
            # that exact name.
            cible: macos-aarch64
            # The workspace target is at the root, not under the crate. Each
            # line must match at least one file.
            paquets: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/updater/*_aarch64.app.tar.gz
          - os: ubuntu-24.04
            cible: linux-x86_64
            # Checked by `livraison architecture` before upload.
            architecture: x86_64
            # deb and rpm are not signed for the updater: those installs are
            # updated by their package manager.
            paquets: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*_amd64.AppImage
          - os: ubuntu-24.04-arm
            cible: linux-aarch64
            # Built natively on GitHub's ARM64 runner: no cross toolchain, and
            # the bundler's AppImage tooling runs as on x86_64.
            architecture: aarch64
            paquets: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*_aarch64.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check Apple release credentials before installing dependencies
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 script/apple-release check

      - name: Install Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # `rpm` reads the built package's architecture; the bundler does not need it.
          sudo apt-get install -y rpm

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore the Cargo cache
        # Swatinem/rust-cache v2.9.2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0, version read from `packageManager`
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install cargo-about for required third-party notices
        # Same version as qualite.yml; checksums in RESEARCH-NOTES
        # (§ Third-party notices).
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) target=aarch64-apple-darwin
                         checksum=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e ;;
            Linux-X64)   target=x86_64-unknown-linux-musl
                         checksum=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af ;;
            Linux-ARM64) target=aarch64-unknown-linux-musl
                         checksum=af5169282fb6f84e13471493f405437e43ac517744c9ae12fbe2cdf0a6f0e5a8 ;;
            *) echo "No cargo-about binary pinned for $RUNNER_OS-$RUNNER_ARCH."; exit 1 ;;
          esac
          archive="cargo-about-0.9.2-$target.tar.gz"
          curl -LsSf -o "$RUNNER_TEMP/$archive" "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$archive"
          echo "$checksum  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-about-0.9.2-$target/cargo-about"

      - name: Build Linux packages in release mode
        if: runner.os == 'Linux'
        # The same target as locally: `make desktop PROFIL=release`. No
        # secret: the AppImage is signed for the updater by the signing job.
        run: make desktop PROFIL=release

      - name: Check the architecture of the Linux packages
        if: runner.os == 'Linux'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 script/livraison architecture "$ARCHITECTURE" target/release/bundle target/release/oxyn-desktop

      - name: Build, sign and notarize macOS packages
        if: runner.os == 'macOS'
        # Tauri imports the certificate into its temporary keychain. Pass
        # credentials through the environment, never interpolate them into shell.
        # `apple-release build` runs `make desktop PROFIL=release`, then writes
        # the updater archive from the stapled `.app`. The Apple credentials
        # are reachable by the build's code here: an accepted risk
        # (docs/SECURITY.md § The Apple release credentials). The updater key
        # is not in this job.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 script/apple-release build

      - name: Verify macOS signatures and stapled notarization before upload
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 script/apple-release verify

      - name: Name the verified macOS updater archive after its version
        if: runner.os == 'macOS'
        # `apple-release build` names it `Oxyn.app.tar.gz`, without version or
        # architecture. The tag is `v<version>`, checked by the draft job.
        run: |
          set -euo pipefail
          archive=target/release/bundle/macos/Oxyn.app.tar.gz
          staged="target/release/bundle/updater/Oxyn_${RELEASE_TAG#v}_aarch64.app.tar.gz"
          test -f "$archive"
          rm -rf target/release/bundle/updater
          mkdir -p target/release/bundle/updater
          cp "$archive" "$staged"

      - name: Gather the unsigned packages
        env:
          PAQUETS: ${{ matrix.paquets }}
        run: |
          shopt -s nullglob
          staging="$RUNNER_TEMP/paquets"
          mkdir -p "$staging"
          while IFS= read -r motif; do
            [ -n "$motif" ] || continue
            # Unquoted on purpose: the pattern expands to the built files.
            # shellcheck disable=SC2206
            fichiers=($motif)
            if [ ${#fichiers[@]} -eq 0 ]; then
              echo "No package matches $motif: the Tauri bundler wrote nothing where it was expected."
              find . -path ./node_modules -prune -o -type d -name bundle -print
              exit 1
            fi
            cp "${fichiers[@]}" "$staging/"
          done <<< "$PAQUETS"

      - name: Upload the unsigned packages for the signing job
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paquets-${{ matrix.cible }}
          path: ${{ runner.temp }}/paquets
          if-no-files-found: error
          # Packages are already compressed: zipping them again only costs
          # time.
          compression-level: 0

  # The only job that reads the updater key, and it builds nothing. It starts
  # from a fresh checkout of the tag, installs neither Node, pnpm nor Rust, and
  # runs two programs on the key: `script/livraison` from that checkout, and
  # the Tauri CLI release binary pinned below by checksum. The packages arrive
  # as artifacts downloaded by exact name; they are data here, never run. Its
  # token can only read: the signatures leave as an artifact, and `depot`
  # uploads them.
  signature:
    needs: paquets
    # Its deployment rule admits `v*` tags alone, so a manual run must be
    # started from the tag.
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check the updater signing key before downloading the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 script/livraison cle

      - name: Install the pinned Tauri CLI release binary
        # tauri-cli 2.12.1, the version of apps/desktop/package.json, as
        # published by Tauri on GitHub; archive checksum recorded in
        # RESEARCH-NOTES (§ CI and GitHub delivery). Never the npm package:
        # `node_modules` is what a build can rewrite.
        run: |
          set -euo pipefail
          archive=cargo-tauri-x86_64-unknown-linux-gnu.tgz
          curl -LsSf -o "$RUNNER_TEMP/$archive" "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/$archive"
          echo "04ef3a9a2ed7b7dc479bef08ab40deee80065c99fc778f79ebce775eb72bbeff  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tauri-cli"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tauri-cli" cargo-tauri
          echo "TAURI=$RUNNER_TEMP/tauri-cli/cargo-tauri" >> "$GITHUB_ENV"

      - name: Download the macOS packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paquets-macos-aarch64
          path: ${{ runner.temp }}/paquets/macos-aarch64

      - name: Download the x86_64 Linux packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paquets-linux-x86_64
          path: ${{ runner.temp }}/paquets/linux-x86_64

      - name: Download the aarch64 Linux packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paquets-linux-aarch64
          path: ${{ runner.temp }}/paquets/linux-aarch64

      - name: Sign the updater artifacts
        # The only step after the key check that holds the updater key. Each
        # pattern must expand to exactly one file: one that matches nothing
        # stays literal, and `signer` refuses a file that does not exist.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python3 script/livraison signer "$RELEASE_TAG" \
            "$RUNNER_TEMP"/paquets/macos-aarch64/*_aarch64.app.tar.gz \
            "$RUNNER_TEMP"/paquets/linux-x86_64/*_amd64.AppImage \
            "$RUNNER_TEMP"/paquets/linux-aarch64/*_aarch64.AppImage

      - name: Upload the signatures for the upload job
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signatures
          # Kept under their platform's directory, beside their archive once
          # downloaded into the same tree.
          path: ${{ runner.temp }}/paquets/*/*.sig
          if-no-files-found: error

  # Uploads the packages and their signatures to the draft. It holds no
  # secret but GH_TOKEN, and runs no code of the build.
  depot:
    needs: signature
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Download the macOS packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paquets-macos-aarch64
          path: ${{ runner.temp }}/paquets/macos-aarch64

      - name: Download the x86_64 Linux packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paquets-linux-x86_64
          path: ${{ runner.temp }}/paquets/linux-x86_64

      - name: Download the aarch64 Linux packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paquets-linux-aarch64
          path: ${{ runner.temp }}/paquets/linux-aarch64

      - name: Download the updater signatures
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: signatures
          path: ${{ runner.temp }}/paquets

      - name: Upload the packages to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          fichiers=("$RUNNER_TEMP"/paquets/*/*)
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "No package downloaded: the package and signing jobs produced nothing."
            exit 1
          fi
          python3 script/livraison deposer "$RELEASE_TAG" "$GITHUB_REPOSITORY" "${fichiers[@]}"

  # The only job that uploads `latest.json`, and only once every package is in
  # the draft. It holds no secret: it reads public archives and signatures.
  manifeste:
    needs: depot
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install minisign to verify the updater signatures
        # minisign 0.12, Linux archive checksum recorded in RESEARCH-NOTES
        # (§ Tauri updater contracts). Its author's signature was checked once,
        # when the checksum was recorded; the checksum pins those bytes.
        run: |
          set -euo pipefail
          archive=minisign-0.12-linux.tar.gz
          curl -LsSf -o "$RUNNER_TEMP/$archive" "https://github.com/jedisct1/minisign/releases/download/0.12/$archive"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/minisign"
          tar xzf "$RUNNER_TEMP/$archive" --strip-components=2 -C "$RUNNER_TEMP/minisign" minisign-linux/x86_64/minisign
          echo "MINISIGN=$RUNNER_TEMP/minisign/minisign" >> "$GITHUB_ENV"

      - name: Verify the archives, write the update manifest and upload it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/livraison manifeste "$RELEASE_TAG" "$GITHUB_REPOSITORY"
