# The quality gate, run by a machine.
#
# This file adds NO check: a check that existed only here would be invisible
# locally, and nobody could reproduce it before pushing. It calls the targets
# of `make qualite`, split into parallel jobs so that Rust does not wait for the
# stories:
#
#   controles  make socle todo versions front-controles
#   stories    make front-tests SHARD=i/n, one job per shard
#   rust       make front-build rust
#   serveurs   make test-serveurs
#
# Together they are `make qualite`. `make socle` checks it: a workflow that
# forgot a target reached by `qualite` fails the gate.
#
# On a pull request, the `zones` job says which areas the PR touches, and the
# jobs of untouched areas are skipped (ADR-0045). When Rust is touched, it also
# says which workspace packages the PR changes, with every package that depends
# on them: `rust` and `serveurs` pass that list to the same `make` targets as
# `OXYN_PACKAGES`, and `serveurs` is skipped when no server suite is among them
# (ADR-0067). An empty list means the whole workspace, which is what any file
# the script cannot attribute to one package gives. On `main` and on demand,
# everything runs: that is the safety net, except for a push to `main` that
# only touches documentation, which starts nothing. The `qualite` job aggregates the
# others; ruleset 24429281 requires this check and a PR for `main`.
# Administrators may bypass it, direct pushes included; nobody else can.
# Requiring a skipped job instead would leave its check pending forever.
#
# Versions of the actions and tools: docs/RESEARCH-NOTES.md, § CI and GitHub
# delivery.
name: qualite

on:
  push:
    branches: [main]
    # A commit that only touches documentation already passed `controles` on
    # its PR: on `main`, the workflow does not start (ADR-0045, amendment of
    # 2026-10-21). The last matching pattern wins: Markdown under the code
    # directories still triggers, as `script/zones-ci` classifies it — the
    # agent prompts are compiled into `oxyn-ai` (`include_str!`). Never on
    # `pull_request`: the required `qualite` check would never come.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "apps/**/*.md"
      - "crates/**/*.md"
      - "drivers/**/*.md"
  pull_request:
    branches: ["**"]
  # A manual full run on any branch: outside a pull request `script/zones-ci`
  # reports every area as touched, so no job is skipped. Useful to re-run the
  # whole gate on a branch with no PR open.
  workflow_dispatch:

# A second push on the same branch makes the first one moot: letting it finish
# consumes a runner for a result nobody will read.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# macOS and Linux pass the SAME gate (decision D10 of 2026-09-24, ADR-0029):
# the webview is not the same (WKWebView, WebKitGTK), and a rendering checked
# on one is not checked on the other. Windows is not included: the gate assumes
# a POSIX shell (Makefile, foundation scripts).
#
# macOS and Linux run on every pull request and on `main`. History: on
# 2026-09-24 the PR matrix was cut to Linux only after the full matrix
# exhausted the account's quota and no job started any more. The repository is
# public, and standard hosted runners are free and unlimited there: the matrix
# is back on pull requests (ADR-0045, amendment of 2026-10-20).
jobs:
  zones:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.zones.outputs.rust }}
      front: ${{ steps.zones.outputs.front }}
      serveurs: ${{ steps.zones.outputs.serveurs }}
      rust_packages: ${{ steps.zones.outputs.rust_packages }}
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1. On a PR, HEAD is the merge commit: its first
        # parent is the base, and `HEAD^1..HEAD` is exactly the PR.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Install the pinned toolchain
        # `script/zones-ci` reads the package graph with `cargo metadata
        # --no-deps`, which downloads and builds nothing. Should it fail, the
        # script checks every package.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Sort the modified files by area and package
        id: zones
        run: script/zones-ci HEAD^1

  controles:
    needs: zones
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: make socle todo versions
        run: make socle todo versions

      - name: Install Node
        # actions/setup-node v7.0.0. The 22 line satisfies vite 8.3.0
        # (`^20.19.0 || >=22.12.0`) and vitest 4.1.11, and it is the one of the
        # development machine.
        if: needs.zones.outputs.front == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0. Without `version`: it reads the package's
        # `packageManager` field, the only source of the pnpm version.
        if: needs.zones.outputs.front == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        if: needs.zones.outputs.front == 'true'
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: make front-controles
        if: needs.zones.outputs.front == 'true'
        run: make front-controles

  stories:
    # The stories dominate the front-end time (more than four minutes on
    # Linux): each shard runs on its own runner. The number of shards is
    # written twice, in `tranche` and in `SHARD`.
    needs: zones
    if: needs.zones.outputs.front == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        tranche: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Place the Playwright browsers
        # A single path on both OSes, outside the repository: `prettier --check .`
        # must not walk it.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Restore the Playwright browsers
        # actions/cache v6.1.0. The key follows the lockfile, which carries the
        # `playwright` version: a version bump downloads the browser again.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      - name: Install the stories browser
        # The stories run in Chromium through Playwright
        # (apps/desktop/vite.config.ts). With the browser restored, only the
        # system libraries remain, which the cache does not cover.
        run: pnpm -C apps/desktop exec playwright install --with-deps chromium

      - name: make front-tests
        run: make front-tests SHARD=${{ matrix.tranche }}/2

  rust:
    # It also carries `front-build`: `oxyn-desktop` embeds the front end, and
    # the front-end build has no other job. A front-end PR therefore runs it,
    # without what only serves `make rust`.
    needs: zones
    if: needs.zones.outputs.rust == 'true' || needs.zones.outputs.front == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # Line numbers are enough for a panic trace; the rest of the debug info
      # weighs down linking and the cache without serving anything on a runner.
      # The `test` profile inherits from `dev`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Tauri's system libraries
        # List from the Tauri documentation (Debian prerequisites), with no
        # addition: `keyring` goes through zbus, pure Rust, and needs no libdbus.
        if: runner.os == 'Linux' && needs.zones.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the pinned toolchain
        # No third-party action: `rust-toolchain.toml` is authoritative
        # (ADR-0008), and rustup applies it on its own. An action taking a
        # version as a parameter would create a second source of truth, which
        # would diverge.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore the Cargo cache
        if: needs.zones.outputs.rust == 'true'
        # Swatinem/rust-cache v2.9.2. `cache-on-failure`: without it, the cache
        # is only saved after a successful job, and a red gate recompiles the
        # whole graph on every push — which is what happened on every run until
        # 2026-09-24.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Install Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Create the Cargo bin directory
        if: needs.zones.outputs.rust == 'true'
        # Some `macos-latest` runners ship rustup without `~/.cargo/bin`, and
        # the three tools below are extracted there: the runs 39981789035 and
        # 40000784069 failed at the next step with `tar: could not chdir to
        # '/Users/runner/.cargo/bin'`, before any build. Creating it and putting
        # it on the `PATH` costs nothing where it already exists.
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        if: needs.zones.outputs.rust == 'true'
        # The profile of `.config/nextest.toml` — serialized execution of the
        # driver tests, termination of a hanging test — only applies if nextest
        # is present. Version and checksums were read from the GitHub release
        # assets on 2026-10-03 (RESEARCH-NOTES, CI and GitHub delivery).
        run: |
          # renovate: cargo-nextest
          version=0.9.146
          case "$RUNNER_OS" in
            macOS) target=universal-apple-darwin
                   checksum=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8 ;;
            Linux) target=x86_64-unknown-linux-gnu
                   checksum=682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428 ;;
            *) echo "Unsupported runner: $RUNNER_OS"; exit 1 ;;
          esac
          archive="cargo-nextest-$version-$target.tar.gz"
          curl -LsSfO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/$archive"
          echo "$checksum  $archive" | shasum -a 256 -c -
          tar xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      - name: Install cargo-deny
        if: needs.zones.outputs.rust == 'true'
        # `make deny` deliberately tolerates a missing local tool, but CI must
        # exercise licenses and advisories. Version and checksums were read
        # from the GitHub release assets on 2026-10-03 (RESEARCH-NOTES).
        run: |
          # renovate: cargo-deny
          version=0.20.2
          case "$RUNNER_OS" in
            macOS) target=aarch64-apple-darwin
                   checksum=fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3 ;;
            Linux) target=x86_64-unknown-linux-musl
                   checksum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
            *) echo "Unsupported runner: $RUNNER_OS"; exit 1 ;;
          esac
          archive="cargo-deny-$version-$target.tar.gz"
          curl -LsSfO "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$archive"
          echo "$checksum  $archive" | shasum -a 256 -c -
          tar xzf "$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-deny-$version-$target/cargo-deny"
          cargo deny --version

      - name: Install cargo-about
        # `front-build` generates the third-party license notices with
        # cargo-about (script/licences-tierces, ADR-0044). Without it, the build
        # goes through without notices and the generation would never be
        # exercised here. Binary published by EmbarkStudios, version and
        # checksums read on 2026-09-25 (RESEARCH-NOTES § Licenses).
        run: |
          case "$RUNNER_OS" in
            macOS) cible=aarch64-apple-darwin
                   empreinte=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e ;;
            Linux) cible=x86_64-unknown-linux-musl
                   empreinte=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af ;;
          esac
          archive="cargo-about-0.9.2-$cible.tar.gz"
          curl -LsSfO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$archive"
          echo "$empreinte  $archive" | shasum -a 256 -c -
          tar xzf "$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-about-0.9.2-$cible/cargo-about"

      - name: make front-build
        # `front-build` first: `oxyn-desktop` embeds `apps/desktop/dist` at
        # compile time.
        run: make front-build

      - name: make rust
        if: needs.zones.outputs.rust == 'true'
        env:
          # Empty outside a pull request, or when the PR reaches beyond
          # packages: the whole workspace (ADR-0067).
          OXYN_PACKAGES: ${{ needs.zones.outputs.rust_packages }}
        run: make rust

  serveurs:
    # A real database is a Linux-only concern: the desktop build is still
    # covered on both operating systems by `rust`, while this job proves the
    # server behavior that an ignored test cannot exercise elsewhere.
    needs: zones
    if: needs.zones.outputs.rust == 'true' && needs.zones.outputs.serveurs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: oxyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: oxyn
          MYSQL_DATABASE: t
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -poxyn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        # The tag is the one RESEARCH-NOTES records for ADR-0061.
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      clickhouse:
        # The tag of ADR-0060, checked on Docker Hub (RESEARCH-NOTES).
        image: clickhouse/clickhouse-server:26.3.59.10
        env:
          CLICKHOUSE_USER: oxyn
          CLICKHOUSE_PASSWORD: oxyn
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user oxyn --password oxyn --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Tauri's system libraries
        # The desktop cancellation suite compiles the Tauri backend.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the pinned toolchain
        # No third-party action: `rust-toolchain.toml` is authoritative.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore the Cargo cache
        # Swatinem/rust-cache v2.9.2.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Install Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Install cargo-nextest
        # The binary and its checksum are recorded in RESEARCH-NOTES.
        run: |
          # renovate: cargo-nextest
          version=0.9.146
          archive="cargo-nextest-$version-x86_64-unknown-linux-gnu.tar.gz"
          checksum=682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
          curl -LsSfO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/$archive"
          echo "$checksum  $archive" | shasum -a 256 -c -
          tar xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      - name: Install cargo-about
        # `test-serveurs` builds the embedded front end before compiling the
        # desktop suite, so its generated notices must exist.
        run: |
          archive="cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz"
          checksum=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
          curl -LsSfO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$archive"
          echo "$checksum  $archive" | shasum -a 256 -c -
          tar xzf "$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about"

      - name: Start PostgreSQL with trusted TLS for production reads
        run: |
          certificate_dir="$RUNNER_TEMP/oxyn-postgres-tls"
          server_dir="$certificate_dir/server"
          mkdir -p "$server_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$certificate_dir/ca.key" \
            -out "$certificate_dir/ca.crt" \
            -subj "/CN=Oxyn disposable test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$server_dir/server.key" \
            -out "$certificate_dir/server.csr" \
            -subj "/CN=localhost"
          openssl x509 -req -days 1 \
            -in "$certificate_dir/server.csr" \
            -CA "$certificate_dir/ca.crt" \
            -CAkey "$certificate_dir/ca.key" \
            -CAcreateserial \
            -out "$server_dir/server.crt" \
            -extfile <(printf '%s\n' \
              'basicConstraints=critical,CA:FALSE' \
              'subjectAltName=DNS:localhost' \
              'keyUsage=critical,digitalSignature,keyEncipherment' \
              'extendedKeyUsage=serverAuth')
          chmod 600 "$server_dir/server.key"
          sudo chown 999:999 "$server_dir/server.key"
          docker run --detach --rm --name oxyn-production-read-tls \
            --publish 127.0.0.1:5433:5432 \
            --volume "$server_dir:/certs:ro" \
            --env POSTGRES_PASSWORD=oxyn \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17 -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for attempt in {1..30}; do
            docker exec oxyn-production-read-tls pg_isready -U postgres && exit 0
            sleep 1
          done
          docker logs oxyn-production-read-tls
          exit 1

      - name: make test-serveurs
        env:
          OXYN_PG_TEST_URL: postgres://postgres:oxyn@localhost:5432/postgres?sslmode=disable
          OXYN_MYSQL_TEST_URL: mysql://root:oxyn@localhost:3306/t?sslmode=prefer
          OXYN_PG_PRODUCTION_TEST_URL: postgres://postgres:oxyn@localhost:5433/postgres?sslmode=verify-full
          OXYN_CLICKHOUSE_TEST_URL: http://oxyn:oxyn@127.0.0.1:8123
          OXYN_REDIS_TEST_URL: redis://localhost:6379/0?tls=disable
          # sqlx trusts this disposable CA while verify-full validates the leaf SAN.
          PGSSLROOTCERT: ${{ runner.temp }}/oxyn-postgres-tls/ca.crt
          # Only the selected server suites are built and run (ADR-0067).
          OXYN_PACKAGES: ${{ needs.zones.outputs.rust_packages }}
        run: make test-serveurs

      - name: Remove the TLS test server
        if: always()
        run: docker rm --force oxyn-production-read-tls || true

  qualite:
    # The only required status check. It succeeds if `zones` succeeded and no
    # other job failed or was cancelled: a job skipped because its area is
    # untouched counts as successful. A failed `zones` would skip all the
    # others, hence its separate case.
    needs: [zones, controles, stories, rust, serveurs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate the results
        env:
          ZONES: ${{ needs.zones.result }}
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "zones: $ZONES; all: $RESULTATS"
          test "$ZONES" = success
          for resultat in $RESULTATS; do
            case "$resultat" in
              success|skipped) ;;
              *) echo "A job ended as \"$resultat\"."; exit 1 ;;
            esac
          done
