# The quality gate, run by a machine.
#
# This file adds NO check: a check that existed only here would be invisible
# locally, and nobody could reproduce it before pushing. It calls the targets
# of `make qualite`, split into parallel jobs so that Rust does not wait for the
# stories:
#
#   controles  make socle todo front-controles
#   stories    make front-tests SHARD=i/n, one job per shard
#   rust       make front-build rust
#
# Together they are `make qualite`. `make socle` checks it: a workflow that
# forgot a target reached by `qualite` fails the gate.
#
# On a pull request, the `zones` job says which areas the PR touches, and the
# jobs of untouched areas are skipped. On `main` and on demand, everything
# runs: that is the safety net (ADR-0045). The `qualite` job aggregates the
# others, and it is the only status check branch protection requires — a
# required check on a skipped job would wait forever.
#
# Versions of the actions and tools: docs/RESEARCH-NOTES.md, § CI and GitHub
# delivery.
name: qualite

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  # The full matrix, macOS included, on demand on any branch: for a PR that
  # touches rendering specific to WKWebView.
  workflow_dispatch:

# A second push on the same branch makes the first one moot: letting it finish
# consumes a runner for a result nobody will read.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# macOS and Linux pass the SAME gate (decision D10 of 2026-09-24, ADR-0029):
# the webview is not the same (WKWebView, WebKitGTK), and a rendering checked
# on one is not checked on the other. Windows is not included: the gate assumes
# a POSIX shell (Makefile, foundation scripts).
#
# On a pull request, Linux only; macOS is added on `main` and on demand
# (`workflow_dispatch`). One minute of macOS runner counts as ten on a private
# repository: the full matrix on every PR exhausted the account's quota on
# 2026-09-24, and no job started any more. Everything merged still goes through
# macOS, on `main`.
jobs:
  zones:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.zones.outputs.rust }}
      front: ${{ steps.zones.outputs.front }}
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1. On a PR, HEAD is the merge commit: its first
        # parent is the base, and `HEAD^1..HEAD` is exactly the PR.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Sort the modified files by area
        id: zones
        run: script/zones-ci HEAD^1

  controles:
    needs: zones
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["macos-latest", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: make socle todo
        run: make socle todo

      - name: Install Node
        # actions/setup-node v7.0.0. The 22 line satisfies vite 8.3.0
        # (`^20.19.0 || >=22.12.0`) and vitest 4.1.11, and it is the one of the
        # development machine.
        if: needs.zones.outputs.front == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0. Without `version`: it reads the package's
        # `packageManager` field, the only source of the pnpm version.
        if: needs.zones.outputs.front == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        if: needs.zones.outputs.front == 'true'
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: make front-controles
        if: needs.zones.outputs.front == 'true'
        run: make front-controles

  stories:
    # The stories dominate the front-end time (more than four minutes on
    # Linux): each shard runs on its own runner. The number of shards is
    # written twice, in `tranche` and in `SHARD`.
    needs: zones
    if: needs.zones.outputs.front == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["macos-latest", "ubuntu-24.04"]') }}
        tranche: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Place the Playwright browsers
        # A single path on both OSes, outside the repository: `prettier --check .`
        # must not walk it.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Restore the Playwright browsers
        # actions/cache v6.1.0. The key follows the lockfile, which carries the
        # `playwright` version: a version bump downloads the browser again.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      - name: Install the stories browser
        # The stories run in Chromium through Playwright
        # (apps/desktop/vite.config.ts). With the browser restored, only the
        # system libraries remain, which the cache does not cover.
        run: pnpm -C apps/desktop exec playwright install --with-deps chromium

      - name: make front-tests
        run: make front-tests SHARD=${{ matrix.tranche }}/2

  rust:
    # It also carries `front-build`: `oxyn-desktop` embeds the front end, and
    # the front-end build has no other job. A front-end PR therefore runs it,
    # without what only serves `make rust`.
    needs: zones
    if: needs.zones.outputs.rust == 'true' || needs.zones.outputs.front == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["macos-latest", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # Line numbers are enough for a panic trace; the rest of the debug info
      # weighs down linking and the cache without serving anything on a runner.
      # The `test` profile inherits from `dev`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Tauri's system libraries
        # List from the Tauri documentation (Debian prerequisites), with no
        # addition: `keyring` goes through zbus, pure Rust, and needs no libdbus.
        if: runner.os == 'Linux' && needs.zones.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the pinned toolchain
        # No third-party action: `rust-toolchain.toml` is authoritative
        # (ADR-0008), and rustup applies it on its own. An action taking a
        # version as a parameter would create a second source of truth, which
        # would diverge.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore the Cargo cache
        if: needs.zones.outputs.rust == 'true'
        # Swatinem/rust-cache v2.9.2. `cache-on-failure`: without it, the cache
        # is only saved after a successful job, and a red gate recompiles the
        # whole graph on every push — which is what happened on every run until
        # 2026-09-24.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Install Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Install the front-end dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Install cargo-nextest
        if: needs.zones.outputs.rust == 'true'
        # The profile of `.config/nextest.toml` — serialized execution of the
        # driver tests, termination of a hanging test — only applies if nextest
        # is present. Version and checksums were read from the GitHub release
        # assets on 2026-10-03 (RESEARCH-NOTES, CI and GitHub delivery).
        run: |
          # renovate: cargo-nextest
          version=0.9.146
          case "$RUNNER_OS" in
            macOS) target=universal-apple-darwin
                   checksum=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8 ;;
            Linux) target=x86_64-unknown-linux-gnu
                   checksum=682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428 ;;
            *) echo "Unsupported runner: $RUNNER_OS"; exit 1 ;;
          esac
          archive="cargo-nextest-$version-$target.tar.gz"
          curl -LsSfO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/$archive"
          echo "$checksum  $archive" | shasum -a 256 -c -
          tar xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      - name: Install cargo-deny
        if: needs.zones.outputs.rust == 'true'
        # `make deny` deliberately tolerates a missing local tool, but CI must
        # exercise licenses and advisories. Version and checksums were read
        # from the GitHub release assets on 2026-10-03 (RESEARCH-NOTES).
        run: |
          # renovate: cargo-deny
          version=0.20.2
          case "$RUNNER_OS" in
            macOS) target=aarch64-apple-darwin
                   checksum=fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3 ;;
            Linux) target=x86_64-unknown-linux-musl
                   checksum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
            *) echo "Unsupported runner: $RUNNER_OS"; exit 1 ;;
          esac
          archive="cargo-deny-$version-$target.tar.gz"
          curl -LsSfO "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$archive"
          echo "$checksum  $archive" | shasum -a 256 -c -
          tar xzf "$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-deny-$version-$target/cargo-deny"
          cargo deny --version

      - name: Install cargo-about
        # `front-build` generates the third-party license notices with
        # cargo-about (script/licences-tierces, ADR-0044). Without it, the build
        # goes through without notices and the generation would never be
        # exercised here. Binary published by EmbarkStudios, version and
        # checksums read on 2026-09-25 (RESEARCH-NOTES § Licenses).
        run: |
          case "$RUNNER_OS" in
            macOS) cible=aarch64-apple-darwin
                   empreinte=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e ;;
            Linux) cible=x86_64-unknown-linux-musl
                   empreinte=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af ;;
          esac
          archive="cargo-about-0.9.2-$cible.tar.gz"
          curl -LsSfO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$archive"
          echo "$empreinte  $archive" | shasum -a 256 -c -
          tar xzf "$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-about-0.9.2-$cible/cargo-about"

      - name: make front-build
        # `front-build` first: `oxyn-desktop` embeds `apps/desktop/dist` at
        # compile time.
        run: make front-build

      - name: make rust
        if: needs.zones.outputs.rust == 'true'
        run: make rust

  qualite:
    # The only required status check. It succeeds if `zones` succeeded and no
    # other job failed or was cancelled: a job skipped because its area is
    # untouched counts as successful. A failed `zones` would skip all the
    # others, hence its separate case.
    needs: [zones, controles, stories, rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate the results
        env:
          ZONES: ${{ needs.zones.result }}
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "zones: $ZONES; all: $RESULTATS"
          test "$ZONES" = success
          for resultat in $RESULTATS; do
            case "$resultat" in
              success|skipped) ;;
              *) echo "A job ended as \"$resultat\"."; exit 1 ;;
            esac
          done
