# La porte de qualité, exécutée par une machine.
#
# Ce fichier n'ajoute AUCUN contrôle : un contrôle qui n'existerait qu'ici serait
# invisible en local, et personne ne saurait le reproduire avant de pousser. Il
# appelle les cibles de `make qualite`, réparties en jobs parallèles pour que le
# Rust n'attende pas les stories :
#
#   controles  make socle todo front-controles
#   stories    make front-tests SHARD=i/n, un job par tranche
#   rust       make front-build rust
#
# Leur réunion est `make qualite`. `make socle` le vérifie : un workflow qui
# oublierait une cible atteinte par `qualite` fait échouer la porte.
#
# Versions des actions et des outils : docs/RESEARCH-NOTES.md, § CI et
# livraison GitHub.
name: qualite

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Une deuxième poussée sur la même branche rend la première sans objet : la
# laisser finir consomme un runner pour un résultat que personne ne lira.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# macOS et Linux passent la MÊME porte (décision D10 du 2026-09-24, ADR-0029) :
# la webview n'est pas la même (WKWebView, WebKitGTK), et un rendu vérifié sur
# l'une ne l'est pas sur l'autre. Windows n'y est pas : la porte suppose un
# shell POSIX (Makefile, scripts du socle).
jobs:
  controles:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installer Node
        # actions/setup-node v7.0.0. La ligne 22 satisfait vite 8.3.0
        # (`^20.19.0 || >=22.12.0`) et vitest 4.1.11, et c'est celle de la
        # machine de développement.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0. Sans `version` : il lit le champ
        # `packageManager` du paquet, seule source de la version de pnpm.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Installer les dépendances du front
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: make socle todo front-controles
        run: make socle todo front-controles

  stories:
    # Les stories dominent le temps du front (plus de quatre minutes sous
    # Linux) : chaque tranche tourne sur son propre runner. Le nombre de
    # tranches est écrit deux fois, dans `tranche` et dans `SHARD`.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        tranche: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installer Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Installer les dépendances du front
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Placer les navigateurs de Playwright
        # Un seul chemin sur les deux OS, hors du dépôt : `prettier --check .`
        # ne doit pas le parcourir.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Restaurer les navigateurs de Playwright
        # actions/cache v6.1.0. La clé suit le lockfile, qui porte la version
        # de `playwright` : une montée de version retélécharge le navigateur.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      - name: Installer le navigateur des stories
        # Les stories tournent dans Chromium via Playwright
        # (apps/desktop/vite.config.ts). Navigateur restauré, il ne reste que
        # les bibliothèques système, que le cache ne couvre pas.
        run: pnpm -C apps/desktop exec playwright install --with-deps chromium

      - name: make front-tests
        run: make front-tests SHARD=${{ matrix.tranche }}/2

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # Les numéros de ligne suffisent à une trace de panique ; le reste des
      # informations de débogage alourdit l'édition de liens et le cache sans
      # servir à rien sur un runner. Le profil `test` hérite de `dev`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installer les bibliothèques système de Tauri
        # Liste de la documentation Tauri (prérequis Debian), sans ajout :
        # `keyring` passe par zbus, du Rust pur, et ne demande pas libdbus.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installer la chaîne d'outils épinglée
        # Aucune action tierce : `rust-toolchain.toml` fait autorité (ADR-0008),
        # et rustup l'applique seul. Une action qui prendrait une version en
        # paramètre créerait une deuxième source de vérité, qui divergerait.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restaurer le cache Cargo
        # Swatinem/rust-cache v2.9.2. `cache-on-failure` : sans lui, le cache
        # n'est enregistré qu'après un job réussi, et une porte rouge recompile
        # tout le graphe à chaque poussée — c'est ce qui s'est produit à chaque
        # exécution jusqu'au 2026-09-24.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Installer Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Installer les dépendances du front
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Installer cargo-nextest
        # Le profil de `.config/nextest.toml` — exécution sérialisée des tests
        # de driver, arrêt d'un test qui pend — ne s'applique que si nextest est
        # présent. Sans cette étape, `make test` retomberait silencieusement sur
        # `cargo test` et le profil ne servirait jamais.
        run: |
          case "$RUNNER_OS" in
            macOS) platform=mac ;;
            Linux) platform=linux ;;
          esac
          curl -LsSf "https://get.nexte.st/latest/$platform" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: make front-build rust
        # `front-build` d'abord : `oxyn-desktop` embarque `apps/desktop/dist`
        # à la compilation.
        run: make front-build rust
