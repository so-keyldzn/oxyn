# La porte de qualité, exécutée par une machine.
#
# Ce fichier n'ajoute AUCUN contrôle : un contrôle qui n'existerait qu'ici serait
# invisible en local, et personne ne saurait le reproduire avant de pousser. Il
# appelle les cibles de `make qualite`, réparties en jobs parallèles pour que le
# Rust n'attende pas les stories :
#
#   controles  make socle todo front-controles
#   stories    make front-tests SHARD=i/n, un job par tranche
#   rust       make front-build rust
#
# Leur réunion est `make qualite`. `make socle` le vérifie : un workflow qui
# oublierait une cible atteinte par `qualite` fait échouer la porte.
#
# Sur une pull request, le job `zones` dit quelles zones la PR touche, et les
# jobs des zones intactes sont sautés. Sur `main` et à la demande, tout tourne :
# c'est le filet (ADR-0045). Le job `qualite` agrège les autres, et c'est le
# seul status check que la protection de branche exige — un check requis sur un
# job sauté attendrait pour toujours.
#
# Versions des actions et des outils : docs/RESEARCH-NOTES.md, § CI et
# livraison GitHub.
name: qualite

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  # La matrice complète, macOS compris, à la demande sur n'importe quelle
  # branche : pour une PR qui touche au rendu propre à WKWebView.
  workflow_dispatch:

# Une deuxième poussée sur la même branche rend la première sans objet : la
# laisser finir consomme un runner pour un résultat que personne ne lira.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# macOS et Linux passent la MÊME porte (décision D10 du 2026-09-24, ADR-0029) :
# la webview n'est pas la même (WKWebView, WebKitGTK), et un rendu vérifié sur
# l'une ne l'est pas sur l'autre. Windows n'y est pas : la porte suppose un
# shell POSIX (Makefile, scripts du socle).
#
# Sur une pull request, Linux seul ; macOS s'ajoute sur `main` et à la demande
# (`workflow_dispatch`). Une minute de runner macOS en compte dix sur un dépôt
# privé : la matrice complète sur chaque PR a épuisé le quota du compte le
# 2026-09-24, et plus aucun job ne démarrait. Tout ce qui est fusionné passe
# encore par macOS, sur `main`.
jobs:
  zones:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.zones.outputs.rust }}
      front: ${{ steps.zones.outputs.front }}
    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1. Sur une PR, HEAD est le commit de fusion : son
        # premier parent est la base, et `HEAD^1..HEAD` est exactement la PR.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Ranger les fichiers modifiés par zone
        id: zones
        run: script/zones-ci HEAD^1

  controles:
    needs: zones
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["macos-latest", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: make socle todo
        run: make socle todo

      - name: Installer Node
        # actions/setup-node v7.0.0. La ligne 22 satisfait vite 8.3.0
        # (`^20.19.0 || >=22.12.0`) et vitest 4.1.11, et c'est celle de la
        # machine de développement.
        if: needs.zones.outputs.front == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0. Sans `version` : il lit le champ
        # `packageManager` du paquet, seule source de la version de pnpm.
        if: needs.zones.outputs.front == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Installer les dépendances du front
        if: needs.zones.outputs.front == 'true'
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: make front-controles
        if: needs.zones.outputs.front == 'true'
        run: make front-controles

  stories:
    # Les stories dominent le temps du front (plus de quatre minutes sous
    # Linux) : chaque tranche tourne sur son propre runner. Le nombre de
    # tranches est écrit deux fois, dans `tranche` et dans `SHARD`.
    needs: zones
    if: needs.zones.outputs.front == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["macos-latest", "ubuntu-24.04"]') }}
        tranche: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installer Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Installer les dépendances du front
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Placer les navigateurs de Playwright
        # Un seul chemin sur les deux OS, hors du dépôt : `prettier --check .`
        # ne doit pas le parcourir.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Restaurer les navigateurs de Playwright
        # actions/cache v6.1.0. La clé suit le lockfile, qui porte la version
        # de `playwright` : une montée de version retélécharge le navigateur.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      - name: Installer le navigateur des stories
        # Les stories tournent dans Chromium via Playwright
        # (apps/desktop/vite.config.ts). Navigateur restauré, il ne reste que
        # les bibliothèques système, que le cache ne couvre pas.
        run: pnpm -C apps/desktop exec playwright install --with-deps chromium

      - name: make front-tests
        run: make front-tests SHARD=${{ matrix.tranche }}/2

  rust:
    # Il porte aussi `front-build` : `oxyn-desktop` embarque le front, et le
    # build du front n'a pas d'autre job. Une PR front le lance donc, sans ce
    # qui ne sert qu'à `make rust`.
    needs: zones
    if: needs.zones.outputs.rust == 'true' || needs.zones.outputs.front == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["macos-latest", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # Les numéros de ligne suffisent à une trace de panique ; le reste des
      # informations de débogage alourdit l'édition de liens et le cache sans
      # servir à rien sur un runner. Le profil `test` hérite de `dev`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Récupérer le dépôt
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installer les bibliothèques système de Tauri
        # Liste de la documentation Tauri (prérequis Debian), sans ajout :
        # `keyring` passe par zbus, du Rust pur, et ne demande pas libdbus.
        if: runner.os == 'Linux' && needs.zones.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installer la chaîne d'outils épinglée
        # Aucune action tierce : `rust-toolchain.toml` fait autorité (ADR-0008),
        # et rustup l'applique seul. Une action qui prendrait une version en
        # paramètre créerait une deuxième source de vérité, qui divergerait.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restaurer le cache Cargo
        if: needs.zones.outputs.rust == 'true'
        # Swatinem/rust-cache v2.9.2. `cache-on-failure` : sans lui, le cache
        # n'est enregistré qu'après un job réussi, et une porte rouge recompile
        # tout le graphe à chaque poussée — c'est ce qui s'est produit à chaque
        # exécution jusqu'au 2026-09-24.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Installer Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Installer pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/desktop/package.json
          cache: true
          cache_dependency_path: apps/desktop/pnpm-lock.yaml

      - name: Installer les dépendances du front
        run: pnpm -C apps/desktop install --frozen-lockfile

      - name: Installer cargo-nextest
        if: needs.zones.outputs.rust == 'true'
        # Le profil de `.config/nextest.toml` — exécution sérialisée des tests
        # de driver, arrêt d'un test qui pend — ne s'applique que si nextest est
        # présent. Sans cette étape, `make test` retomberait silencieusement sur
        # `cargo test` et le profil ne servirait jamais.
        run: |
          case "$RUNNER_OS" in
            macOS) platform=mac ;;
            Linux) platform=linux ;;
          esac
          curl -LsSf "https://get.nexte.st/latest/$platform" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Installer cargo-about
        # `front-build` génère les mentions des licences tierces avec
        # cargo-about (script/licences-tierces, ADR-0044). Sans lui, le build
        # passe sans mentions et la génération ne serait jamais exercée ici.
        # Binaire publié par EmbarkStudios, version et empreintes relevées le
        # 2026-09-25 (RESEARCH-NOTES § Licences).
        run: |
          case "$RUNNER_OS" in
            macOS) cible=aarch64-apple-darwin
                   empreinte=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e ;;
            Linux) cible=x86_64-unknown-linux-musl
                   empreinte=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af ;;
          esac
          archive="cargo-about-0.9.2-$cible.tar.gz"
          curl -LsSfO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$archive"
          echo "$empreinte  $archive" | shasum -a 256 -c -
          tar xzf "$archive" --strip-components=1 -C "${CARGO_HOME:-$HOME/.cargo}/bin" "cargo-about-0.9.2-$cible/cargo-about"

      - name: make front-build
        # `front-build` d'abord : `oxyn-desktop` embarque `apps/desktop/dist`
        # à la compilation.
        run: make front-build

      - name: make rust
        if: needs.zones.outputs.rust == 'true'
        run: make rust

  qualite:
    # Le seul status check requis. Il réussit si `zones` a réussi et si aucun
    # autre job n'a échoué ni été annulé : un job sauté parce que sa zone est
    # intacte compte comme réussi. `zones` en échec sauterait tous les autres,
    # d'où son cas à part.
    needs: [zones, controles, stories, rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Agréger les résultats
        env:
          ZONES: ${{ needs.zones.result }}
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "zones : $ZONES ; tous : $RESULTATS"
          test "$ZONES" = success
          for resultat in $RESULTATS; do
            case "$resultat" in
              success|skipped) ;;
              *) echo "Un job a fini en « $resultat »."; exit 1 ;;
            esac
          done
