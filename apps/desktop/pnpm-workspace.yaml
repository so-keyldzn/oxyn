# Install scripts run arbitrary code from the registry on every developer
# machine and in CI. Both packages below ship their native binary as an
# optional platform dependency, so their scripts only re-check what is already
# installed: they stay disabled. A new entry here is a reviewed decision
# (docs/SECURITY.md, « Dépendances »), never a reflex to silence the warning.
allowBuilds:
  esbuild: false
  unrs-resolver: false

# Patched transitive dependencies; rationale and removal conditions are dated
# in docs/RESEARCH-NOTES.md (npm security overrides).
overrides:
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": 14.0.4
  "@ts-morph/common>minimatch": 11.0.8
  "@typescript-eslint/typescript-estree>minimatch": 11.0.8
  "eslint-plugin-import-x>minimatch": 11.0.8
  katex: 0.18.2
  seroval: 1.6.12
  seroval-plugins: 1.6.12
  source-map-js: 1.2.2
  "zod@^4": 4.6.7
