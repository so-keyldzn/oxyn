# What `make licences-npm` accepts on top of the `allow` list of deny.toml,
# for the production npm dependencies of apps/desktop.
#
# The deny.toml list stays the rule: a license only enters it if compatible
# with the GPLv3 (ADR-0044). This file only carries what is specific to npm.
# The FSF verdict on each license is in RESEARCH-NOTES § Licenses.

# Two unconditional code licenses that the Rust graph does not contain.
# FSF: `0BSD` (#Zero-BSD) and `Unlicense` (#Unlicense) are compatible.
allow = ["0BSD", "Unlicense"]

# A license accepted for one package, and for it alone: it does not suit code.

[[exceptions]]
name = "@fontsource-variable/geist"
allow = ["OFL-1.1"]
# A font. FSF (#SILOFL): a free license for fonts, its only unusual
# requirement is "harmless".

[[exceptions]]
name = "@fontsource-variable/geist-mono"
allow = ["OFL-1.1"]

[[exceptions]]
name = "caniuse-lite"
allow = ["CC-BY-4.0"]
# Browser compatibility data. FSF (#ccby): compatible with all versions of the
# GPL.

[[exceptions]]
name = "argparse"
allow = ["Python-2.0"]
# A port of Python's argparse. FSF (#Python): compatible.

# A package that does not declare its license. The value comes from its license
# file, reread at this version: a bump requires rereading it.

[[clarify]]
name = "khroma"
version = "2.1.0"
license = "MIT"
# `package.json` without a `license` field; the `license` file is the MIT text.
