[package]
name = "oxyn-driver-sqlite"
description = "SQLite driver (embedded)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxyn-core.workspace = true
oxyn-catalog.workspace = true
oxyn-data.workspace = true
oxyn-driver.workspace = true
arrow.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

# `harness = false`: criterion provides its own `main`. Without it, libtest's
# test harness takes over and criterion's arguments are refused.
[[bench]]
name    = "row_to_batch"
harness = false
