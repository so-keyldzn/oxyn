version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxyn-core.workspace = true
oxyn-catalog.workspace = true
oxyn-data.workspace = true
oxyn-driver.workspace = true
arrow.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

# `harness = false` : criterion fournit son propre `main`. Sans cela, le harnais
# de test de libtest s'installe et les arguments de criterion sont refusés.
[[bench]]
name    = "row_to_batch"
harness = false
