[package]
name = "oxyn-data"
description = "Arrow result buffers: streaming, backpressure, spill to disk, export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0 and not the workspace's GPL: a third-party driver links this crate
# (ADR-0044).
license = "Apache-2.0"
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxyn-core.workspace = true
arrow.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
rstest.workspace = true
# Rereads a `FormatOptions` written before a field was added: read
# compatibility of a persisted format (I-11) cannot be proven without
# deserializing.
serde_json.workspace = true

[[bench]]
name    = "spilled_page"
harness = false
