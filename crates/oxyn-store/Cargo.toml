[package]
name = "oxyn-store"
description = "Persistent local state: workspaces, history, audit log (SQLite)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# What neighboring crates switch on for their tests only: a way to age a
# session heartbeat without waiting for the abandonment threshold. Absent from
# an ordinary build, hence absent from the shipped binary.
[features]
test-support = []

[dependencies]
# `ReasoningBlock` and `StopReason` are persisted **as is**, and they come from
# here, not from `oxyn-llm`: a provider requires receiving them identically on
# the next turn, so copying them would make two definitions, and their
# `#[non_exhaustive]` would force the conversion into a `_ =>` arm that would
# silently lose a block added later. Declaring them in `oxyn-core` avoids both,
# without bringing an HTTP client into `oxyn-store` or `oxyn-exec`.
oxyn-core.workspace = true
oxyn-query.workspace = true
chrono.workspace = true
directories.workspace = true
parking_lot.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
