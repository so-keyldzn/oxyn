[package]
name = "oxyn-embed"
description = "Local text embeddings: pinned model download, verification and CPU inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxyn-core.workspace = true
thiserror.workspace = true
burn.workspace = true
burn-flex.workspace = true
burn-store.workspace = true
tokenizers.workspace = true
sha2.workspace = true
reqwest.workspace = true
futures.workspace = true
parking_lot.workspace = true
# `fs` and `io-util` write the download without blocking the executor; `rt`
# sends hashing and conversion — seconds of CPU and disk — to the blocking pool.
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }

[dev-dependencies]
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
