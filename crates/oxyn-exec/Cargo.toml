[package]
name = "oxyn-exec"
description = "Ordonnanceur : Policy gate, annulation, timeouts, journalisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxyn-core.workspace = true
oxyn-catalog.workspace = true
oxyn-data.workspace = true
oxyn-driver.workspace = true
oxyn-query.workspace = true
oxyn-store.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Un curseur factice rend des `RecordBatch` : la seule façon de prouver le
# chemin nominal de l'historique — durée et lignes — sans serveur.
arrow.workspace = true
oxyn-driver-sqlite.workspace = true
rstest.workspace = true
# Only the test binary needs more than one worker thread: the abandonment
# tests race a real blocking-pool write against a dropped future.
tokio = { workspace = true, features = ["rt-multi-thread"] }
