[package]
name = "oxyn-ai"
description = "Agent runtime: tools, context, privacy tiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
oxyn-core.workspace = true
oxyn-catalog.workspace = true
oxyn-llm.workspace = true
oxyn-query.workspace = true
async-process.workspace = true
async-trait.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
# Agent files' front matter, parsed strict (ADR-0049 § 1).
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Read the **names** of the MCP servers and plugins in `~/.codex/config.toml`
# to switch them off at launch: no key switches them off as a block (ADR-0032).
toml.workspace = true
# `net` and `rt` for MCP listening on the loopback: without naming them here,
# the crate only compiles thanks to a neighbor's feature unification.
tokio = { workspace = true, features = ["net", "rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Raise a log to `debug` and check what does not appear in it (I-03).
tracing-subscriber.workspace = true

# Kill the process **group** of an agent launched behind `npx`: otherwise the
# real agent reattaches to pid 1 and outlives the end of the conversation.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
