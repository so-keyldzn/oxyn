[package]
name = "oxyn-desktop"
description = "Oxyn desktop host: Tauri window and IPC bridge to the command bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "oxyn-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
oxyn-ai.workspace = true
oxyn-core.workspace = true
oxyn-catalog.workspace = true
oxyn-data.workspace = true
oxyn-driver.workspace = true
oxyn-driver-postgres.workspace = true
oxyn-driver-sqlite.workspace = true
oxyn-exec.workspace = true
oxyn-llm.workspace = true
oxyn-query.workspace = true
oxyn-secrets.workspace = true
oxyn-store.workspace = true
anyhow.workspace = true
arrow.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# An approved sample's token: random, never derived from what it grants.
uuid.workspace = true

[dev-dependencies]
# Ages a session's heartbeat, to test recovery without waiting two minutes.
oxyn-store = { workspace = true, features = ["test-support"] }
# Scripts a model's stream, to run the tool loop against a real database.
futures.workspace = true
rstest.workspace = true
# An in-memory agent session, to hold an agent link the way a launch does.
agent-client-protocol.workspace = true
